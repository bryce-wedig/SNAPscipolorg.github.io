- question: >-
    Colorado farmers are facing multiple threats, amidst water scarcity
    and rising prices for fertilizer and other imported materials. As
    agriculture is our #1 export sector, in what ways do you imagine using
    your role to support evidence-based advancements to protect and support
    our farmers and natural resources in the years ahead?
  tag:
    - Agriculture
    - Environment

- question: >-
    America has a growing AI industry, supporting cutting-edge innovation
    but raising issues of resource use, privacy, and economics. What is the
    right balance of costs and benefits for new data center construction in
    Colorado, and how would your policies accomplish that balance?
  tag:
    - Artificial Intelligence
    - Environment

- question: >-
    Colorado has experienced a lingering measles outbreak since March of
    2025. What evidence-based policies do you support to improve community
    and preventive health for your constituents, for infectious diseases
    and other threats?
  tag: Public Health

- question: >-
