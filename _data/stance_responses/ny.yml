    New York’s hospitals, universities, and research institutions are national leaders in medical and scientific research, and NIH funding supports important work while also contributing significantly to our state’s economy.

    I support responsible federal spending and believe every government program should be accountable for results. However, I would be concerned about significant across-the-board reductions in NIH research funding that could disrupt promising medical research, eliminate skilled jobs, or put New York institutions at a competitive disadvantage.

    I would work with New York’s congressional delegation, universities, hospitals, and research institutions to identify the potential impact of federal changes and advocate for continued investment in high-value, evidence-based research. I would also look for opportunities to strengthen partnerships between universities, healthcare institutions, and New York’s private biotechnology and technology sectors.

    Taxpayers deserve accountability for how research dollars are spent, but fiscal responsibility and supporting scientific innovation do not have to be competing goals. New York should work to remain a national leader in research that produces measurable medical, scientific, and economic benefits.
    
    KEYWORDS: Medical Research; Fiscal Accountability; Scientific Innovation; New York Jobs
