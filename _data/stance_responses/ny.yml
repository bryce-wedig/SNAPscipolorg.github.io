    Public safety agencies should have access to effective tools that help solve crimes and protect communities, but those tools must be accompanied by strong privacy protections and public accountability.

    I support clear statewide standards governing ALPR systems, including limits on data retention, restrictions on sharing information with unauthorized entities, auditing requirements, and transparency regarding how data is used. Access should be tied to legitimate law enforcement purposes and subject to oversight.

    KEYWORDS: Privacy, Public Safety, Transparency, Accountability 
    
