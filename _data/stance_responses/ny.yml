    NIH-funded research has produced important medical and scientific advances, and New York has a significant research sector that benefits from federal investment. In FY2025, New York received approximately $2.13 billion in NIH awards. The NIH has a $47.5 billion budget for FY2026, a 1% increase from FY2025. However, I believe every federal research dollar should be subject to transparency, accountability, and rigorous scientific standards.
    
    I would be concerned about significant funding reductions that eliminate promising research, disrupt ongoing studies, or cause talented researchers and institutions to leave New York. At the same time, I support reviewing NIH spending, reducing unnecessary administrative costs, and ensuring funding is directed toward research with strong scientific merit and measurable public benefit.

