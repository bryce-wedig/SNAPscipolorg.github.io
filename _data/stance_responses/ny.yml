    ALPR technology can be a valuable law enforcement tool for solving crimes and locating stolen vehicles, missing persons, and suspects. However, the ability to collect location data on large numbers of people who are not suspected of wrongdoing requires appropriate safeguards.
    
    I would support legislation requiring clear limits on how ALPR data is collected, accessed, stored, and shared. Data should be collected for legitimate public-safety purposes, with access limited to authorized law enforcement personnel and documented investigative needs. Retention periods should be limited, with information unrelated to an active investigation deleted after a reasonable period.

    Sharing ALPR data with other agencies, including federal agencies, should require clear legal authority and accountability. Agencies should maintain access logs and conduct regular audits to ensure the system is being used appropriately. There should also be penalties for unauthorized access or misuse.

    At the same time, I would not support eliminating a technology simply because it can be misused. The goal should be to preserve its legitimate public-safety benefits while protecting law-abiding New Yorkers from unnecessary government surveillance.

    Public safety and privacy should not be mutually exclusive.
    
    KEYWORDS: Public Safety & Privacy, Responsible Data Use, Limited Retention, Accountability

