    International students and researchers are essential contributors to New York's economy, universities, healthcare institutions, and innovation ecosystem. While immigration policy is primarily a federal responsibility, New York should continue positioning itself as a welcoming destination for talented students and researchers from around the world.

    If federal visa restrictions reduce the STEM talent pipeline, New York should strengthen partnerships among universities, industry, and research institutions to retain talent and support workforce development. We should also expand state investments in higher education, research, and STEM career pathways for New Yorkers.

    Our state’s economic future depends on attracting and retaining highly skilled individuals, no matter their background, who contribute to scientific discovery, entrepreneurship, and technological advancement.

    KEYWORDS: STEM Workforce, Higher Education, Innovation Economy, Talent Retention

