    Farmers are already experiencing the impacts of more frequent flooding, droughts, and severe storms. New York should help agricultural producers build resilience through investments in climate-smart farming practices, soil health, water management infrastructure, and emergency preparedness.

    I support expanding technical assistance programs, improving access to crop insurance, investing in drainage and irrigation improvements, and strengthening disaster recovery resources. Research partnerships between universities, extension services, and farmers can also help identify practices that improve productivity while reducing vulnerability to extreme weather.

    KEYWORDS: Climate Resilience, Farm Sustainability, Disaster Preparedness, Soil Health

