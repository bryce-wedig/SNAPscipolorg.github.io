  question: ny-q1
  date: 2026-09-22 # optional
  response: |
    Artificial intelligence presents significant opportunities for economic growth, research, and job creation, but those benefits cannot come at the expense of ratepayers, local communities, or our climate goals. I was a big supporter of legislation establishing a moratorium on large-scale data centers because New York needs a framework that fully evaluates their impacts on energy demand, water use, and utility costs.

    New York should welcome innovation, but we have to ensure that taxpayers and utility customers are not subsidizing projects that strain our electric grid or undermine our climate commitments.
    
    KEYWORDS: Responsible AI, Energy Infrastructure, Labor Standards, Community Benefits

