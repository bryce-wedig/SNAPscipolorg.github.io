  response: |
    Automated License Plate Readers can be valuable tools for law enforcement when used to locate stolen vehicles, find missing or endangered people, and investigate serious crimes. I support giving police access to effective technology, but that access should come with clear safeguards protecting the privacy of law-abiding citizens.

    New York currently lacks a comprehensive statewide framework governing law-enforcement ALPR data, and legislation addressing these issues is already being considered in Albany.

    I would support statewide standards requiring ALPR searches to have a legitimate law-enforcement purpose, with auditable records showing who accessed the system and why. Data on vehicles not connected to an investigation should be retained only for a limited period, while relevant evidence could be preserved for legitimate investigations.

    Sharing with other local, state, or federal law-enforcement agencies should be permitted for legitimate criminal investigations and public-safety emergencies, with stronger judicial oversight when accessing historical location information or conducting broader searches.
    
    The goal should be straightforward: give police the technology they need to protect our communities without creating an unrestricted database of the movements of innocent New Yorkers.

    KEYWORDS: Public Safety; Personal Privacy; Law-Enforcement Accountability; Judicial Oversight

