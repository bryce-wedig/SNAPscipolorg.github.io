    Wildfire smoke does not stop at international borders, and New York needs a practical plan for protecting residents when air quality reaches unhealthy levels.

    I would support improving real-time air-quality monitoring and public notification systems so schools, families, employers, and outdoor workers receive clear and timely information when conditions become dangerous. We should also help schools, senior centers, and other public facilities improve filtration and HVAC systems where needed and identify community clean-air locations for severe smoke events.

    Particular attention should be given to children, seniors, people with respiratory or heart conditions, and those whose jobs require them to work outdoors. Emergency planning should include clear guidelines for schools, youth sports, outdoor workers, and public events based on air-quality conditions.

    These investments should be targeted and evidence-based. We should continue studying the health effects of repeated wildfire-smoke exposure and adjust our response as better data becomes available. New York cannot control Canadian wildfires, but we can make sure our communities are informed, prepared, and equipped to respond when smoke reaches us.

    KEYWORDS: Air-Quality Monitoring; Emergency Preparedness; Clean-Air Facilities; Evidence-Based Response

