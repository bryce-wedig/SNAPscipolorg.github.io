    New York should respect federal authority over immigration and visas while competing to attract top STEM talent through excellence, not by resisting lawful enforcement. International students contribute to our universities and innovation economy, but national security, reciprocity, and prioritization of American students must come first.
    
    Rather than litigating or circumventing federal changes, we should focus on making New York’s universities and research institutions more competitive: streamlining state-level research partnerships, expanding domestic STEM pipelines, and ensuring strong vetting so that those who do receive visas are high-caliber contributors. Shorter durations and tighter screening can reduce overstays and security risks without shutting out legitimate talent.
    
    The evidence that guides me is workforce data showing genuine shortages in certain advanced fields, paired with the clear need to protect American graduates and national interests. New York’s best response is to raise its own standards and competitiveness, not to fight the federal government’s responsibility to control its borders and visas.

    KEYWORDS: Respect federal authority; Attract talent through excellence; Prioritize American students; Expand domestic STEM pipelines

