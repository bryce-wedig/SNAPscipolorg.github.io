    I'd let the evidence guide these decisions, not slogans from either side. My approach is to weigh what a product does for farm yields, food supply, and farmers' costs against what independent data show about its risks to human health, water, pollinators, and farm workers.

    For safety, I'd rely on federal and state regulators' own risk assessments: the EPA's registration reviews and tolerance levels, the USDA's Pesticide Data Program, which tests residues on food, and the FDA's residue monitoring. In New York, I'd use the DEC's pesticide registration and use data, the state's mandatory pesticide sales and use reporting, and Department of Health findings. For international scientific consensus, I'd look at the National Academies, the World Health Organization, and the European Food Safety Authority.I'd also want to hear directly from New York farmers, farmworkers, and public health experts, because data on paper doesn't always show what works in the field. When the evidence shows a real risk, we act. When it shows a tool is safe and important to farmers' livelihoods, we protect access to it. And any restriction should come with a workable alternative, so we don't lose farms or push production out of state.
  
