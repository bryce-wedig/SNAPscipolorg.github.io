  question: ny-q1
  date: 2026-09-27 # optional
  response: |
    I support responsible data center development in New York, but taxpayers, homeowners, and small businesses should not be forced to subsidize the infrastructure costs created by large private facilities. 
    
    Data centers can bring significant private investment, construction activity, technology investment, and high-skill jobs. At the same time, they can place substantial demands on electricity, water, and local infrastructure. New York needs a balanced approach that recognizes both realities.

    I would support clear, predictable standards for new facilities rather than indefinite moratoriums or constantly changing regulations. Projects should be evaluated based on their actual impacts, including electricity and water use, and companies should be responsible for the incremental infrastructure costs they create rather than shifting those costs to ordinary ratepayers.

    I also support local communities having a meaningful voice through zoning and permitting, along with appropriate protections for neighboring properties and natural resources.

    Tax incentives should be transparent, measurable, and tied to demonstrated public benefits such as investment, jobs, and infrastructure improvements. If taxpayers provide an incentive, New Yorkers should receive a clear return.

    New York should be open for business, but businesses should pay their fair share of the costs they create.
    
    KEYWORDS: Growth, Accountability, Local Control Innovation Without Taxpayer Burden Jobs, Investment, Fiscal Responsibility Pro-Growth, Pro-Taxpayer, Pro-Community

