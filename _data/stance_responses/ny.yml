    I will rely on rigorous, science-based evidence, not fear or activism, when weighing pesticides. The data that matter most are peer-reviewed risk assessments from the EPA and USDA, actual residue monitoring results, and real-world studies on crop yields, food prices, and farmer livelihoods.
    
    Pesticides remain essential tools for protecting New York’s agricultural productivity and keeping food affordable and secure. Blanket restrictions that ignore dose, exposure levels, and proven benefits risk higher costs, lower yields, and greater reliance on imports produced under weaker standards. I will prioritize targeted, evidence-driven regulation that addresses genuine risks while preserving farmers’ ability to manage pests effectively. Decisions must rest on measurable outcomes for safety, food security, and economic viability, not political pressure.

    KEYWORDS: Science-based evidence; EPA and USDA risk assessments; Protect agricultural productivity; Targeted, evidence-driven regulation

