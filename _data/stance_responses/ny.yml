    I oppose cuts that would reduce NIH funding for New York's hospitals, universities, and research institutions. 

    New York is home to world-class research institutions that are advancing treatments for cancer, Alzheimer's disease, heart disease, and many other conditions. Reductions in federal research funding would threaten scientific progress and weaken our competitiveness.
    As a State Senator, I plan on advocating for robust federal research investments while supporting state initiatives that strengthen research partnerships, workforce development, and innovation. 
    
    KEYWORDS: NIH Funding, Medical Research, Innovation, Economic Development
  