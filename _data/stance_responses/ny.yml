    New York spends real money on science, but I don't think we spend it well. Right now our approach is to pick a handful of industries and write very large checks, with semiconductors at the top of the list, then AI and quantum. That's industrial policy, not a science strategy, and it has four problems.

    It's too narrow. Billions go to a few favored sectors, while I'm not aware of any major state program that supports researchers pursuing their own ideas in biology, chemistry, physics, or medicine. Breakthroughs rarely come from the sector the government picked in advance. Cutting stem cell funding in 2021 is a good example: we walked away from a program that helped make New York a leader, and researchers left for states that kept theirs.

    It's driven by economic development, not by science. Much of the money goes to construction, incentives, and commercialization grants, all judged by jobs and private investment. Those goals matter, but they don't build the pipeline of discovery that future industries depend on. We're paying for the factories without investing enough in the ideas that fill them.

    It leans heavily on Washington. New York's contribution to research is small compared to federal funding, so when federal support gets uncertain, our universities and labs are exposed. Even the Empire AI board has noted how valuable state-led funding is when federal money is in doubt. That should tell us the state needs a steadier base of its own, not just a few flashy projects.

    It's concentrated in a few places. Much of the flagship spending goes to a handful of sites, and the benefits don't reach all our campuses, small and mid-sized colleges, or regions.

    I'd take a different approach: keep the successful large projects, but hold them to strict performance and accountability standards, and rebalance toward a more stable, merit-based state research program that funds the best ideas across fields and institutions, requires matching private dollars, and reports results publicly. That gives us a research base that produces the next Micron, not just one that hosts it

