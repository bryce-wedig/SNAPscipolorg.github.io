  response: |
    Agricultural policy should be guided by the best available science and a commitment to both food security and public health. Decisions regarding pesticide use should be based on peer-reviewed research, environmental monitoring data, public health evidence, and guidance from scientific and regulatory agencies.

    I support evaluating pesticides on a case-by-case basis, considering both their effectiveness and potential impacts on farmworkers, consumers, pollinators, water quality, and ecosystems. Where evidence identifies significant risks, New York should support safer alternatives and help farmers transition to effective pest-management practices.

    Any restrictions should be paired with technical assistance, research investments, and support for integrated pest management strategies that maintain productivity while reducing risks.
    
    KEYWORDS: Evidence-Based Policy, Food Security, Public Health, Integrated Pest Management
    
