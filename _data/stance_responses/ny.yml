  response: |
    The wildfire smoke events that affected New York demonstrated how environmental challenges can quickly become public health emergencies. New York should invest in improved air-quality monitoring, public notification systems, emergency preparedness, and community resilience measures.

    Schools, childcare centers, senior facilities, and public buildings should have access to effective air filtration systems, particularly in communities with vulnerable populations. Public health agencies should also continue educating residents about reducing exposure during poor air-quality events.

    Preparation is especially important because these events can affect children, seniors, and individuals with respiratory conditions. 

    KEYWORDS: Air Quality, Public Health, Emergency Preparedness, Community Resilience
    
