  response: |
    New York’s pesticide policies should be guided by sound science, reliable data, and the practical realities facing farmers. Pesticides play an important role in protecting crops, maintaining yields, controlling invasive pests, and keeping food affordable, but legitimate concerns about human health and environmental impacts must also be taken seriously.
    
    When considering restrictions, I would look at peer-reviewed research, EPA and New York Department of Environmental Conservation safety assessments, monitoring data on residues and environmental impacts, and evidence regarding risks to farm workers and surrounding communities. I would also consider whether effective alternatives are actually available, affordable, and capable of maintaining crop yields.

    Policy should distinguish between pesticides based on their demonstrated risks rather than treating all products the same. Where evidence identifies a significant risk, reasonable restrictions or mitigation measures should be considered. Where evidence supports safe use, farmers should not face unnecessary restrictions that could reduce production or increase food costs.

    Farmers should also have a voice in the process. New York should encourage integrated pest management and safer alternatives where practical, while preserving farmers’ ability to protect their crops and livelihoods.

    The goal should be safe food, productive farms, and evidence-based regulation—not regulation based on fear or politics.
    
    KEYWORDS: Science-Based Regulation, Farmers’ Choice, Food Security, Safety & Accountability

