    New York farmers face increasingly unpredictable weather, from late freezes and flooding to drought, hail, and extreme heat. Albany should help them protect their land, crops, and livelihoods.

    I would support practical resilience investments, including improved drainage and water management, irrigation and water storage, frost protection, soil-health practices, and better weather monitoring and warnings.

    When disasters strike, assistance must reach farmers quickly. I would support targeted disaster-recovery grants or low-interest aid that complements federal programs and helps family farms recover from substantial documented losses.

    Farmers also need a seat at the table. Albany should avoid one-size-fits-all solutions and work with the people who know the land best. Our policies should strengthen preparedness, protect productive farmland, keep food affordable, and ensure New York family farms remain viable for future generations.

    KEYWORDS: Farm Resilience; Disaster Recovery; Protecting Farmland; Family Farms

