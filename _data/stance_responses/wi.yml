    Regarding data centers, given that AI is almost certainly going to continue expanding, they will be built somewhere. Currently in Wisconsin there is no statewide regulation or guidance regarding these facilities. The only action taken was to extend a sales tax credit, which has cost the state about $2 billion. I would support a moratorium on new construction until we have better guidance for communities. This guidance would include forbidding the use of NDA's, requiring the builder to cover all infrastructure costs, and have rigorous environmental impact studies related to land use, electricity and water consumption. Other local impacts such as noise and light pollution would have to be factored in as well. This is not an exhaustive list, but a starting point. The final decision belongs to the community. Regarding AI itself, I have deep concerns based on reporting in multiple sources of entities hallucinating, performing in unexpected ways, and most recently escaping a contained environment and hacking into a different (and sophisticated) AI company. If we don't start building rigorous guardrails controlling AI behavior, I fear we will face a potential calamity.

    KEYWORDS: Safety. Accountability. Full disclosure.

