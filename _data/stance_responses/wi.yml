    I believe science is an essential tool for making good public policy, but it should never be treated as unquestionable. History reminds us that scientific understanding evolves. During my lifetime, I’ve heard predictions of global cooling, imminent resource depletion, and other forecasts that never materialized as expected. More recently, the COVID-19 pandemic demonstrated that even experts can disagree and that recommendations can change as new evidence emerges.

    That’s why I believe lawmakers should rely on transparent data, peer-reviewed research, open debate, and experts who are willing to challenge one another—not simply accept the prevailing narrative. Good policy weighs scientific evidence alongside economic impacts, constitutional rights, practical experience, and the needs of Wisconsin families.

    Science is strongest when it welcomes questions, tests assumptions, and adjusts to new evidence. That’s the approach I’ll bring to the Legislature.

    KEYWORDS: Scientific Integrity, Transparency, Critical Thinking

