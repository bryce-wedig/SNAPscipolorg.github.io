  date: 2026-07-18
  primary_candidate: false
  response: |
    I support fully funding Wisconsin's public schools to reverse the 600+ school closures and 7% enrollment decline, particularly impacting rural STEM access. As a school board treasurer and pharmacist preceptor, I've seen how underfunding devastates educational opportunities.
    
    Equitable Funding Reform: Restore state commitment to cover two-thirds of school costs through Fair Funding formulas, reducing property tax burdens while ensuring rural districts have resources for science labs, technology, and qualified STEM teachers.
    
    STEM & Robotics Expansion: Mandate K-12 STEM programming as fully funded extracurricular activities, including robotics teams, coding clubs, and science competitions. Treat these like athletics—essential enrichment, not luxury add-ons. Research shows hands-on STEM improves retention and college readiness.techplan+1
    
    Rural School Support: Increase sparsity aid beyond $2 million, recognizing rural schools face higher per-pupil costs. Fund regional STEM hubs where multiple districts share resources, teachers, and equipment like 3D printers and robotics kits.
    
    Teacher Development: Expand science teacher professional development funding ($250,000 insufficient) and create loan forgiveness for STEM educators in underserved areas.
    
    Rationale: Wisconsin's education spending trails national averages while voucher programs drain resources. My healthcare career was built with a strong WI public university science programing—every child deserves that foundation.

    KEYWORDS: school funding equity, STEM education access, rural education support

- candidate_first_name: Brian
  candidate_last_name: Bock
  state: wi
  race: State Assembly
  district: 61
  party: Democratic
  question: wi-q5
  date: 2026-07-18
  primary_candidate: false
  response: |
    As a clinical pharmacist who precepts pharmacy students and manages behavioral health patients, I rely on scientific evidence daily. If elected, I would consult scientists in multiple capacities:
    
    Direct Policy Areas: Healthcare legislation (medication safety, mental health outcomes), building and construction (engineers, union tradesmen) environmental regulations (water quality, air pollution), education curricula (STEM standards, evidence-based teaching), and public health emergencies (pandemic response, vaccination policy).
    
    Advisory Mechanisms: Establish relationships with scientific experts within Wisconsin, UW researchers, medical professionals, and public health experts to review legislation before votes. My advisory plan mimics how healthcare uses pharmacy & therapeutics committees for medication decisions.
    
    Evidence-Based Decision Making: Consult peer-reviewed research, CDC guidelines, and Wisconsin-specific studies from Wisconsin college and university institutions when crafting policies affecting schools, healthcare, and environment.
    
    Transparency: Publicly disclose which scientific sources informed each policy position, allowing constituents to evaluate evidence quality. Scientists serve as honest brokers presenting options, not advocates dictating choices.
    
    Rationale: My healthcare career demonstrates that ignoring scientific consensus harms patients—same applies to public policy. Wisconsin faces complex challenges (climate change, healthcare access, education outcomes) requiring expert input alongside constituent values and fiscal realities. Science informs but doesn't replace democratic decision-making.

    KEYWORDS: evidence-based policy, scientific advisory committees, transparent decision-making

- candidate_first_name: Brian
  candidate_last_name: Bock
  state: wi
  race: State Assembly
  district: 61
  party: Democratic
  question: wi-q7
  date: 2026-07-18
  primary_candidate: false
  response: |
    As a clinical pharmacist and behavioral health specialist, I've witnessed how infectious disease outbreaks devastate healthcare systems. I support evidence-based policies aligned with Wisconsin Public Health Association (WPHA) recommendations to protect communities and agriculture.
    
    Vaccination & Prevention: Strongly support mandatory school vaccination requirements with medical exemptions only, following WPHA's 2019 measles resolution urging vaccination of every eligible person. Fund public health campaigns reaching vaccine-hesitant communities through pharmacists and local health departments.
    
    Surveillance & Response: Increase CDC PHEP grant funding for disease surveillance, immediate reporting systems (Category I diseases within 72 hours), and outbreak response teams. Protect local health officer authority to act swiftly during emergencies.
    
    Healthcare Preparedness: Require long-term care facilities maintain PPE stockpiles, respiratory illness protocols, and staff training—lessons from COVID-19 and current avian influenza threats.
  
    Workforce Investment: Address public health nurse shortages through recruitment initiatives and restore the DHS Director of Public Health Nursing position, recognizing workforce as critical infrastructure.
    
    Agricultural Protection: Coordinate DHS, DATCP, and UW Extension for zoonotic disease monitoring, protecting both farm workers and livestock industries from avian influenza.
    
    Rationale: WPHA emphasizes collective action on root causes and evidence-based policy. My pharmacy experience shows prevention saves lives and costs less than outbreak response.

    KEYWORDS: vaccination policy, disease surveillance, public health preparedness

