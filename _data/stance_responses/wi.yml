  primary_candidate: false
  response: |
    I support expanding Wisconsin Fast Forward grants to fund biotechnology, agricultural innovation, and renewable energy training programs at UW System campuses and technical colleges. Evidence shows programs like MREA's Solar Ready Wisconsin successfully placed 27 interns with solar contractors, demonstrating public-private partnerships work. 
    
    Biotechnology & Healthcare: As a clinical pharmacist, I would look to increase UW-Madison and MCW biohealth research funding, creating pipelines from technical colleges to specialty pharmacy and behavioral health careers. Wisconsin's Biohealth Tech Hub shows strong ecosystem growth requiring skilled workers. 
    
    Agriculture Innovation: Support UW Extension's agricultural education programs and FFA partnerships, training workers in precision agriculture, sustainable farming, and food processing—Wisconsin's economic backbone. 
    
    Clean Energy: Expand Wisconsin Solar Corps and Focus Force Milwaukee models statewide, prioritizing disadvantaged communities for renewable energy career pathways. DWD's $1 million green jobs investment proves effective. 
    
    Rationale: Wisconsin faces workforce shortages in high-skill sectors while workers need re-skilling opportunities. My healthcare background shows targeted training improves outcomes—same applies to bioeconomy sectors. These policies leverage existing UW System infrastructure, technical college networks, and proven models like MREA's NABCEP certification programs. 

    KEYWORDS: workforce development, bioeconomy innovation, technical training

- candidate_first_name: Brian
  candidate_last_name: Bock
  state: wi
