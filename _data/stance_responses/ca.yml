  response: |
    "California’s natural resources are one of our greatest assets, safeguarded by generations that came before us, and we have a responsibility to manage them in ways that protect biodiversity, strengthen climate resilience, and preserve them for future generations. I strongly support California’s 30x30 goal and investment in protecting and restoring open space, wetlands, forests, coastal areas, wildlife habitat, and working lands.

    In Assembly District 12, protecting open space and preventing sprawl are important. Before serving on the Rohnert Park City Council, I worked on the campaign to establish a permanent urban growth boundary. I would bring that same commitment to the Legislature by supporting habitat and watershed restoration, wildfire resilience, sustainable agriculture, Tribal stewardship, and equitable public access to nature.

    We also need responsible land use planning as California transitions to clean energy. Renewable energy, transmission, and storage projects should be accelerated, but should prioritize already developed, disturbed, or degraded lands rather than sacrificing sensitive habitat or protected public lands.

    California should also continue moving away from fossil fuel extraction. I support ending new oil drilling permits and transitioning existing production responsibly, while ensuring workers and communities dependent on those industries have pathways to good union jobs in clean energy, environmental restoration, and climate resilience."
    
    KEYWORDS: 30x30 Conservation, Climate Resilience, Just Transition

