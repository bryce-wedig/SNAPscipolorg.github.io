    "As a longtime classroom educator, I believe improving science proficiency starts with ensuring every student has access to qualified educators, a strong curriculum, and the resources needed for hands-on learning. California should continue investing in evidence-based teacher recruitment and retention strategies, including paid teacher residencies, scholarships and credentialing support, and pathways for classified employees and paraprofessionals to become credentialed teachers, particularly in high-need fields like math and science.

    We also need to retain the educators we already have through competitive compensation, manageable class sizes, mentoring, professional development, and strong working conditions. Simply lowering preparation standards to address shortages is not a sustainable solution.

    For students, I support greater investment in hands-on, inquiry-based science instruction; modern laboratories and classroom materials; tutoring and extended learning opportunities; and stronger connections between science education and career technical education. Those opportunities must be available in every community, not determined by a student’s ZIP code.

    Finally, we should provide additional support for multilingual learners and students who have historically had less access to advanced STEM coursework. Raising science proficiency requires both high expectations and equitable access to the resources that allow students to meet them."
    
    KEYWORDS: Teacher Recruitment, STEM Access, Hands-On Learning

