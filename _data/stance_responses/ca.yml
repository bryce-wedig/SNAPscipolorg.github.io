    "Both Marin and Sonoma are leaders and examples in the protection of public lands and natural resources, with many strategies that can be scaled throughout the state.

    Simply acquiring open space or expanding conservation easements is important, but lands need to be properly managed and maintained as risks of wildfires continue to increase. Reaching our 30x30 goal is more than just a stat, it is a longterm commitment to sustainable management. Below are some policies to pursue and continue:

    - Sustainable practices for working lands (farming, forestry, ranching)
    - Co-management agreements with tribal nations
    - Coastal protection - expanded Marine Protected Areas (MPAs) with a focus on kelp forests"
    
    KEYWORDS: 30x30, co-management, kelp forests, marin protected areas
    
