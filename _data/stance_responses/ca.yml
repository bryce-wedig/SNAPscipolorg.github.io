    "It is critical that California continues to push back on changes by the federal administration to change vaccination guidance that is not based on science. Combined with loss of funding, it will continue to be a challenge to do the outreach and education needed, but when local communities and county health departments have the right resources, it can be done. Over the years, Marin County has had some of the lowest vaccination rates, but now boasts one of the highest. This has happened at the local level through outreach and advocacy over many years. 

    https://www.nbcbayarea.com/video/investigations/marin-county-vaccination-rates/3946390/

    The budget will continue to be tight, but I would support additional resources to support local jurisdictions to increase vaccination rates and reach herd immunity. It can be done, but needs to be supported locally and resources should be linked to outcomes."
    
    KEYWORDS: vaccination, Marin County

