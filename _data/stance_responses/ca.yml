    "California’s investment in scientific research is an investment in our economy, workforce, and ability to solve major challenges. As federal research funding grows increasingly uncertain, California should protect the research capacity of our public universities and prevent the loss of scientists, students, and innovation.

    I support sustained state funding for the University of California and California State University systems, along with targeted investments in areas where California has significant needs and an opportunity to lead, including climate science, wildfire resilience, clean energy, water, agriculture, public health, biotechnology, and emerging technologies. We should also invest in graduate students, early-career researchers, laboratories, and research infrastructure.

    Research is also economic policy. University research creates jobs, helps launch new technologies and industries, improves agriculture and public health, and gives policymakers better tools to address challenges from wildfire to infectious disease. Public investment should produce public benefit through strong partnerships among universities, government, workers, communities, and responsible industry.

    California has built much of its economic strength around education, research, and innovation. Protecting that foundation should remain a state priority."
    
    KEYWORDS: Research Investment, Public Universities, Innovation Economy
    
