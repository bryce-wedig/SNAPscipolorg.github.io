    "Public transportation is essential infrastructure, and we should fund it like the public service it is. California cannot meet its climate, affordability, and mobility goals if transit agencies are trapped in a cycle of service cuts and declining ridership. I support stable, long-term state funding so agencies can provide frequent, reliable, and affordable service.

    We also need to invest in the people who make our transit systems work through strong labor standards, competitive wages and benefits, workforce development, and greater protections for operators and other transit workers.

    Increasing ridership requires service people can depend on. I support better frequency and connections between systems, affordable fares, expanded service in working-class, rural, and underserved communities, and improved access for seniors and people with disabilities.

    California should continue transitioning public fleets to zero-emission technology while ensuring workers receive the training needed as technology changes. Public dollars should strengthen public transit and good union jobs, not encourage privatization or worker displacement.

    In Marin and Sonoma, strengthening bus, ferry, and regional connections is especially important to give residents realistic alternatives to driving while reducing congestion and pollution."
    
    KEYWORDS: Transit Funding, Union Workforce, Zero-Emission Transit
    
