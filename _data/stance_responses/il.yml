    Science should be a core subject in every CPS school (starting in Kindergarten) rather than something that happens when the schedule allows, and right now it is not rolled out evenly. Some of our schools have labs, equipment, and a teacher with a real science background, while others have one teacher covering science alongside three other subjects with no materials and no prep time.
    Our district is short science teachers, and that shortage hits hardest in the schools that already have the most vacancies.

    We have Grow Your Own pathways that can help us develop science teachers from the communities our schools actually serve.
    We also cannot teach lab science without a working lab.  Currently, our buildings are in need of repair and renovation in order to provide contemporary science facilities.

    As I said up top, we need to start earlier with Science.  Elementary science gets squeezed out by reading and math, and by the time students reach high school we are asking them to cram on a subject that is somewhat new to them.

    One of my platform planks is around career pathways.  We need more STEM pathways in health care, environmental science, and engineering - built with real employer and union partners and paid work experience - so a student can see where science leads and where it can take them.

- candidate_first_name: Hilario
  candidate_last_name: Dominguez
  state: il
  race: School Board
  district: President
  party: Non-partisan
  question: il-q7
