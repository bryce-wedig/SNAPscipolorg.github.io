    I support responsible technology and economic development, but I do not support placing large-scale data centers in residential neighborhoods or immediately adjacent to homes, schools, and other sensitive uses. Data centers can create investment and jobs, but those benefits should not come at the expense of residents through higher utility bills, excessive water use, constant noise, traffic, or diminished quality of life.

    I would support statewide minimum siting standards while preserving strong local control. Those standards should include meaningful setbacks and buffers from residential property, public notice and hearings before approval, independent assessments of electricity, water, noise, traffic, and environmental impacts, and disclosure of projected energy and water consumption before construction begins. Illinois lawmakers are already considering proposals that would strengthen municipal authority over data-center siting and require greater energy and water disclosure.

    Most importantly, residents should not subsidize the enormous infrastructure demands created by private data centers. I would support requiring the Illinois Commerce Commission to establish data-center-specific utility rates that ensure these facilities pay the costs of new substations, transmission, distribution upgrades, generation capacity, and other infrastructure needed primarily because of their demand. Those expenses should not simply be shifted onto residential customers. I also support exploring a data-center affordability fund, financed by large data-center operators rather than households, to help offset residential energy costs and expand efficiency and weatherization programs. A similar public-benefits and affordability concept has already been proposed in Illinois legislation.

    Water protections must be just as strong. Large facilities should disclose water consumption, demonstrate that adequate supplies exist before approval, prioritize recycled or non-potable water where feasible, and have conservation plans for drought or water shortage conditions.

