    Scientific research may not be my area of expertise, but I strongly believe government has a responsibility to support research that improves people's lives. Many of the medical advances we take for granted today began with publicly funded research. Research helps us prevent disease, find new treatments and cures, improve public health, and understand emerging threats before they become crises.
    I am concerned when federal funding decisions put that work at risk. Illinois is home to world-class universities, hospitals, national laboratories, and research institutions. Their work benefits patients and families, creates jobs, attracts investment, and strengthens our state's economy.
    As a state legislator, I would advocate for Illinois' congressional delegation to protect federal funding for the National Institutes of Health, National Science Foundation, and other critical research programs. At the state level, we should look for ways to protect important research when sudden federal cuts threaten work already underway.
    That doesn't necessarily mean replacing federal funding with state dollars. I would first look at how Illinois can leverage existing resources and strengthen partnerships among universities, research institutions, health systems, foundations, and private industry. We should prioritize research that can improve people's lives, particularly disease prevention, medical treatments, and public health. These investments can also save money over the long term. Preventing disease is better for families—and less costly to our health care system—than treating it after someone becomes seriously ill.
    I've always believed government works best when it looks ahead instead of waiting for a crisis and then trying to catch up. Scientific research is one of the ways we do that. Illinois should continue to be a place where research and innovation improve lives, create good jobs, and help build a healthier future.

