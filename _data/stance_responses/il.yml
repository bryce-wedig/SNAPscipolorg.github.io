    Data centers are part of our growing digital economy, but their rapid expansion has outpaced the rules needed to protect residents, our electric grid, and our natural resources. I do not believe working families should see higher electric or water bills because a multibillion-dollar data center moves into their community.
    That is why I support a statewide framework that requires data centers to pay for the infrastructure and grid upgrades their enormous energy demands create, rather than shifting those costs onto residential ratepayers. Data centers should also be required to publicly report their energy and water use, meet strong energy-efficiency standards, and demonstrate that adequate water and electricity are available before a project moves forward. We also need meaningful standards addressing noise, environmental impacts, and proximity to homes, wetlands, farmland, and other sensitive areas.
    At the same time, I strongly believe in local control. The state should establish a minimum floor for consumer, environmental, and transparency protections, while local governments should retain authority over siting and be able to impose stronger requirements based on the needs of their communities. Local residents deserve to know what is being proposed before agreements are made—not after the decisions have already been made.
    I support many of the concepts contained in the POWER Act, and I am hopeful the General Assembly revisits that legislation and its proposed revisions during the veto session. Illinois needs comprehensive data center guidelines now, before additional development gets ahead of us again.
    I also support the Governor's decision to pause new data center tax incentive agreements while the legislature develops those protections. The original incentive program resulted from bipartisan legislation passed in 2019 and signed by Governor Pritzker, at a time when the scale of today's energy and water demands was not fully anticipated. We now have more information, and public policy should respond to that information.
    This issue is particularly important to me because I hosted a Data Center Forum in August with environmental advocates, labor, community activists, and a Lake County Board member. I wanted residents to hear directly from people with different perspectives and to separate facts from misinformation and disinformation. What became clear is that this cannot simply be a debate between being “for” or “against” data centers. It is about responsible development.
    My priority is protecting ratepayers. Data centers should pay the costs associated with the additional generation, transmission, substations, and other infrastructure necessary to serve them. I also support exploring a separate utility rate structure for extremely large energy users so residential customers are not subsidizing their operations.
    Illinois can benefit from technological investment and the jobs that come with it, but those benefits cannot come at the expense of families who are already struggling with utility bills. Growth should pay its own way, protect our natural resources, and provide a real benefit to the communities being asked to host it.

