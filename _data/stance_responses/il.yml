    Scientific research strengthens Illinois' economy, improves public health, supports agriculture, and drives innovation. Federal funding uncertainty should not undermine our universities and research institutions. With a Masters’ Degree in Wildlife Science I firmly believe that funding scientific research can change our lives for the better in every sphere of our lives.

    I would support sustainable state investments in competitive research grants, university laboratories, and partnerships among universities, hospitals, nonprofits, and Illinois businesses. Priorities should include biomedical research, agricultural innovation, clean energy, and public health. I would also support fellowships that help retain talented researchers in Illinois. As the Chair of the Environmental Committee on the DuPage County Board I have worked with the EnergySense Resilience Institute of University of Illinois, Champaign. I have seen first hand how collaborative approach can help businesses get Green Certified and establish a strong Public-Private sector partnership that fuels clean energy growth at the state level, when we adequately fund scientific research.

    At the federal level, I would work with Illinois' congressional delegation to advocate for stable funding for research agencies. These agencies support discoveries, train future scientists, and fund research that may not receive sufficient private investment.
    Investing in science is investing in Illinois' future. Strong research institutions attract employers, create skilled jobs, develop treatments and technologies, and help solve challenges facing our communities. My goal is to protect Illinois' research capacity through sustainable state funding and continued federal support.

