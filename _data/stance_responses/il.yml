    I would work with the various stakeholders to evaluate the quality and limitations of studies, look for consistent findings across credible sources. I would also consider costs, benefits, unintended consequences, and impacts on diverse communities.

    I would encourage transparent discussions with experts and support measurable goals and periodic reviews to determine whether policies are effective as new evidence emerges. Science cannot answer every policy question, but it helps us understand risks, likely outcomes, and make educated and informed decisions. I am going to use my scientific training to make evidence-based decisions rooted in science and empirical data, wherever applicable.

