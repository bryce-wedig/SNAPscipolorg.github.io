    Agriculture is one of Illinois' greatest economic strengths, and protecting it means protecting the farmers, soil, and water resources that make it possible. I serve on the Board of the Illinois Stewardship Alliance specifically because I care deeply about the future of Illinois agriculture and am concerned about large corporate farming interests coming into our state, exploiting our rich soil and putting additional pressure on our aquifer systems. Once we damage those resources, we cannot easily get them back.
    Changing weather patterns make protecting those resources even more important. Illinois farmers are increasingly dealing with periods of drought, extreme heat, heavy rainfall, and flooding. I support policies that help farmers adapt to these conditions while keeping family farms economically viable.
    That includes supporting soil-health and conservation practices such as cover crops, crop rotation, reduced erosion, and responsible water management. Healthy soil retains more water during dry periods and absorbs more water during heavy rains. I also support agricultural research through our universities and Extension programs so farmers have access to the best science, technology, and information available to respond to changing growing conditions.
    Water must be part of this conversation as well. Illinois needs to better understand and protect its groundwater and aquifer systems, particularly as agriculture, communities, industry, and data centers place competing demands on our water supply. We should not allow any large corporate interest to deplete a resource that surrounding communities and future generations depend upon.
    I also want our policies to work for farmers, not simply impose new requirements on them. Farmers are often among the first to experience changes in weather and growing conditions, and they should be at the table when agricultural and conservation policies are developed. Whenever possible, we should provide incentives, technical assistance, and research that help farmers adopt practices that protect their land while maintaining productive and profitable farms.
    For me, this comes down to stewardship. Illinois has some of the richest farmland in the world and tremendous water resources. Our responsibility is to protect them so that Illinois agriculture—and the family farms and communities that depend on it—remain strong for generations to come.

