    The rise in measles and whooping cough cases should concern all of us, especially because children and medically vulnerable people can face the greatest consequences. We know vaccines have saved lives and prevented serious illness for generations. When diseases we once had largely under control begin coming back, we need to pay attention and act.
    This issue is personal to me in another way. I am a Rotarian, and Rotary has spent decades working toward the worldwide eradication of polio. That effort has helped bring the world incredibly close to eliminating a disease that once terrified families and left children paralyzed. No one wants to go back to a time when parents had to fear polio. Yet misinformation about vaccines threatens the progress we have made, and we have to take that seriously.
    This is exactly the kind of issue I wanted people talking about when I hosted my Healthcare Forum. Dr. Altshuler spoke about people not getting vaccinated and the repercussions we are now seeing, particularly for children. Our Lake County panelist also explained something I think is extremely important: the county helps uninsured and underinsured residents get the vaccinations they need. People need to know that help is available.
    Access matters, too. With changes and cuts to federal health programs, including Medicaid and Medicare, I am concerned about families falling through the cracks. If someone loses coverage, can't find a provider, or simply cannot afford preventive care, vaccinations can get delayed. We need to make it easier—not harder—for people to protect themselves and their families.
    I am also proud that Illinois has taken steps to keep science at the center of our public health decisions at a time when confidence in federal public health leadership has been undermined. Illinois has joined the World Health Organization's Global Outbreak Alert and Response Network, giving our state access to international expertise and information about emerging disease threats. Illinois has also strengthened its own Immunization Advisory Committee and is relying on respected medical organizations and scientific evidence to guide our vaccine recommendations.
    As a legislator, that is the approach I will support. I will listen to epidemiologists, physicians, scientists, local health departments, schools, and the people working directly with families. I want to know where outbreaks are happening, why vaccination rates are falling, what barriers people are facing, and what the science tells us will actually work.
    I will also continue doing what I have already started doing: bringing experts directly into our communities. I believe strongly in public forums where people can ask questions, separate fact from misinformation, and learn where to go for help. If someone wants to protect their child but doesn't have insurance or can't afford a vaccination, we should be helping that family get access to one.
    For me, this is what public health should be about: good science, accurate information, access to care, and bringing people together to solve problems. We have already defeated or dramatically reduced diseases that once devastated families. We should be moving forward, not allowing misinformation or lack of access to take us backward.

