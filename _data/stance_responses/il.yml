    I am proud to have signed the three-year moratorium on AI in CPS classrooms, which gives us time to decide the rules ourselves instead of letting vendors decide them for us. Companies are selling into this district faster than we are making policy and creating guardrails.
    CPS needs a Chief Privacy Officer. Student data is being collected at a scale nobody here is positioned to oversee, and we must protect our students and our families.

    In science specifically, there is real risk around implementing AI without these guardrails. Students learning about the scientific process are learning about forming a hypothesis, running an experiment, and reckoning with a result they did not expect. If we hand our students the answer, we skipt the part that actually teaches them to think. Whatever we eventually allow has to protect the PRACTICE of doing science rather than just the science content.

    I am a special education teacher, so I know assistive technology can be transformative for  students- so  I do not want to lump all technology together as "bad".  But we need tools to  prove they improve learning rather than that it just saving money or creating "efficiency".
