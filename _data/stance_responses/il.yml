    As a member of the Public Health Board of DuPage County Health Department for several years, I have seen first hand that preventing infectious diseases is essential to protecting Illinois families, particularly infants, children, older adults, and immuno-compromised individuals. Rising measles and pertussis cases require effective prevention, accessible vaccination, and coordinated public health responses.

    I would support adequate funding for the Illinois Department of Public Health and local health departments to strengthen disease surveillance, investigate outbreaks, notify exposed individuals, and improve vaccine access. We have strong leaders like Dr Vohra at the Illinois Department of Public Health who are able to make public health decisions keeping in mind the diverse population of Illinois.

    For measles, I would prioritize access to the MMR vaccine and partnerships with schools and healthcare providers to address vaccination gaps. For pertussis, I would support access to age-appropriate DTaP and Tdap vaccines, public education, and prompt reporting of suspected cases.

    I would collaborate with epidemiologists, physicians, pediatricians, and local health officials to review outbreak data, identify vulnerable communities, and evaluate prevention strategies.

    As a state representative, I would advocate for evidence-based legislation, responsible public health funding, and coordination among healthcare providers and government agencies. Our response should follow scientific evidence and prioritize preventing illness while helping residents make informed health decisions.

