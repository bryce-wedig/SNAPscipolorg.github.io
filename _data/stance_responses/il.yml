    Data centers are an issue where Illinois needs to balance economic development with protecting our communities and the resources we all depend on. These facilities can bring investment and economic opportunities, but residents should not be left wondering how much water is being used, how much electricity is being consumed, or whether they are ultimately being asked to pay for the additional infrastructure.
    I support greater transparency and believe the state should build on proposals such as the POWER Act and data center transparency legislation that would require companies to disclose their energy and water use and give the public and regulators better information about their impact. This legislation would also require reporting on water consumption and examine the impact of data centers on utility ratepayers. I would also go a step further in discussing the need for state wide standards for responsible data centers and ensuring local electeds have the necessary information for community benefit agreements and local control.

    The Governor opposes state incentives and as residents of Illinois: We must also consider how local incentives are used by municipalities. Community members should know the full cost and benefit of a proposed data center. Developers should be responsible for the infrastructure and resource demands they create, and not shift those costs onto taxpayers or communities. We should make sure communities have a meaningful opportunity to understand and weigh in on major projects that could affect their water, energy, and environment.

