    The impact of the changing weather patterns on our agriculture is complicated, and it needs coordination among many different sectors to address it. First, we need to do everything we can to mitigate the human impact to changing weather patterns. Second, we need to identify crops, both specific types and broad types, that are resistant to big changes in water, temperature, and fertilizer changes. The most difficult aspect of the changing weather patterns is the unpredictability of it; some weeks are incredibly wet with severe storms, only to be followed by weeks of drought. This seriously complicates identifying crops that can withstand a growing season, as the weather becomes more unpredictable. The third step that I want to see taken is improvements on how we fertilize and irrigate our crops. Advancements have been made over the years to improve water conservation for crops, but as we confront statewide issues of depleted aquifers, we need to continue research into water conservation. Likewise regarding fertilizer, the use of fertilizer greatly improves the yield and quality of crops, but at an incredibly high costs, especially this year. Sustainable farming research should also be continued to improve farming practices that limit the need for fertilization.

