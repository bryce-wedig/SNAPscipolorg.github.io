    Residents should not subsidize infrastructure upgrades primarily needed by large industrial electricity users. I would support utility policies requiring data centers to pay their fair share of grid upgrades and energy costs. I would also encourage renewable energy, energy storage, and closed loop cooling systems.

    To address rising utility bills, I would support stronger oversight of rate increases, targeted assistance for low-income households, and expanded energy-efficiency programs. Tax incentives should be tied to measurable public benefits, including quality jobs and local revenue. My goal is to welcome innovation while ensuring economic development does not come at the expense of residents' health, affordability, or access to essential resources.

