    I support requiring data centers to cover the infrastructure costs they generate and undergo transparent reviews of their energy use, water demand, environmental effects, and community impact before approval. These facilities support the digital economy, but their expansion must not threaten public health, natural resources, or affordable utilities.

    Before a project is approved, developers should disclose projected electricity and water demand, grid and utility upgrades, groundwater effects, noise levels, and impacts on surrounding neighborhoods. Approval conditions should include enforceable conservation, noise-control, monitoring, and public-reporting requirements.

    Residential and small-business customers should not subsidize infrastructure built primarily for large commercial users. I support Illinois Commerce Commission oversight and rate structures that assign project-attributable grid and utility costs to developers while protecting existing ratepayers.

    Any state or local economic-development incentive should include measurable public benefits, transparent terms, compliance reporting, and provisions to recover benefits when commitments are not met. Local approval processes should also provide residents with timely information and a meaningful opportunity to participate.

    These steps balance economic opportunity with long-term public health, environmental, and financial responsibility. They also ensure that decisions with decades-long consequences are based on evidence and that project costs are not shifted to the public.

