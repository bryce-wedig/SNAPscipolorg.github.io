    I believe the best public policy is made when you bring the right people to the table, listen to the experts, examine the evidence, and also listen to the people who will actually be affected by the decisions we make.
    As an attorney, this process is not unfamiliar to me. My work has required me to research complicated issues, evaluate the credibility of information, ask questions, and understand different sides of an issue before reaching a conclusion. I would bring that same discipline to policymaking. Legislators cannot be experts on every scientific or technical subject, but we have a responsibility to seek out credible information, ask the right questions, and be willing to learn before making decisions.
    My Data Center Forum is a good example. As data centers began generating significant concern in our communities, there was also a great deal of misinformation and disinformation surrounding them. Rather than simply taking a position, I brought together environmental advocates, labor, community activists, and a Lake County Board member so residents—and I—could hear different perspectives on energy use, water, jobs, environmental impacts, and local control. That discussion helped reinforce my belief that Illinois needs statewide protections for ratepayers and natural resources while preserving a meaningful role for local communities in siting decisions.
    I took a similar approach with my Healthcare Forum. Health care policy affects patients, providers, hospitals, insurers, employers, and taxpayers, and you cannot fully understand the consequences of a policy by listening to only one of those groups. Bringing people with different experiences and expertise into the same conversation helps identify both the intended and unintended consequences of legislation.
    When evaluating scientific information, I want to know where the evidence comes from, whether it is supported by credible research, whether there is broad agreement among experts, and whether financial or other interests could influence the information being presented. I also think it is important to recognize the difference between established evidence and emerging research—and to be willing to say when we simply don't know enough yet.
    That is how I would approach difficult issues in Springfield: do the research, bring scientists, experts, affected communities and other stakeholders to the table, ask questions, follow the evidence, and then make a decision based on what best serves the public. Good policymaking isn't about pretending you already have every answer. It's about doing the work necessary to make an informed decision.

