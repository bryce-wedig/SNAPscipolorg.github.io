    I also support incentives that allow farmers to participate in renewable energy without taking productive farmland out of agricultural use unnecessarily. That can include on-farm solar, energy-efficient equipment, battery storage, methane recovery, and other technologies that help lower operating costs while creating additional income opportunities.

    At the same time, farmers need affordable crop insurance, access to emergency assistance after extreme weather, stronger local water infrastructure, and continued agricultural research so producers have better seed varieties and farming practices for changing conditions.

    My approach is to make resilience economically worthwhile. Farmers should not be forced to choose between protecting their land, keeping their operations profitable, and adapting to changing weather. State policy should help them do all three.

