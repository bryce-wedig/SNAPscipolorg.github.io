    Concerns over data center development, the environmental impact of these developments, and rising energy costs are among the chief concerns I hear as I am knocking on doors in the 49th District. Across the state our constituents are asking for statewide regulations, and our municipalities, county, city, and village boards are looking to the state for guidance. That is why I strongly support the POWER Act, a comprehensive bill that establishes meaningful, responsible regulations for data center development. This important piece of legislation is still being negotiated with stakeholders from environmental coalitions, labor, and science.

    As currently written the POWER Act would require cumulative environmental impact assessments, public notice, and community benefits agreements. An important component of the bill would  prohibit nondisclosure agreements that could keep communities from understanding a project's impacts. The Power Act would also require water-resource planning, quarterly water-use reporting, water-scarcity plans, and Water Impact Permits with public hearings and five-year renewals. On the energy side, it establishes stronger energy-efficiency requirements and annual energy and water reporting. The bill would require data centers to bring their own clean energy and capacity to Illinois, protecting communities from higher energy costs and ensuring strong environmental standards.The legislation also creates public-benefit and affordability funds supported by fees based on peak electricity demand, helping ensure data centers contribute toward the infrastructure and costs they create.

    My constituents are asking for transparency, meaningful regulations that prioritize clean energy, and relief from increasing energy bills. I believe that the POWER Act speaks to these priorities and I look forward to working towards its passage.

