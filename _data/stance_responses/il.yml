    As a State Representative, I would support creating an Illinois Research Continuity and Matching Fund to help universities and nonprofit research institutions bridge temporary federal funding gaps and provide state matching dollars when those funds make Illinois more competitive for major federal grants. I would also support expanding programs that connect universities with Illinois businesses. Illinois is already investing $3 million in its Innovation Vouchers Program to support research partnerships between companies and Illinois institutions of higher education; I would build on that model.

    Federal research opportunities have not disappeared—for example, NSF announced more than $1.5 billion in new foundational research opportunities in August 2026, but Illinois must position its researchers to compete successfully for every available dollar.

