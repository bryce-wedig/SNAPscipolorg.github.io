    Illinois agriculture is essential to our economy, food supply, and rural communities. Unpredictable rainfall, flooding, drought, and extreme heat increasingly threaten farmers' productivity and financial stability.

    I would support greater investment in agricultural research through the University of Illinois, Illinois Extension, and partnerships with farmers. Priorities should include resilient crop varieties, soil health, efficient water management, and improved weather forecasting.
    I would also support cost-sharing programs and technical assistance for voluntary conservation practices, including cover cropping, reduced tillage, and responsible nutrient management. These practices can protect farmland, reduce erosion, and improve long-term resilience.

    Small and family-owned farms should have access to conservation programs, crop insurance education, disaster recovery assistance, and resources to manage severe weather losses. Investments in rural infrastructure, flood mitigation, and watershed management can further protect agricultural land and surrounding communities.

    I would work with farmers, agricultural scientists, and conservation experts to develop practical, evidence-based policies that reflect local needs. Illinois can maintain its agricultural leadership by investing in research, helping farmers adapt to changing weather patterns, and protecting the soil and water resources future generations will depend on.

