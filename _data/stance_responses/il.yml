    I begin with credible, peer-reviewed research and reliable public data. I examine the strength and limitations of the evidence, compare findings across sources, consult experts with relevant experience, and ask who will be affected by a proposed policy. I also seek differing perspectives and remain willing to revise my position when stronger evidence emerges.

    My work on workplace-violence prevention as President of the Illinois Emergency Nurses Association illustrates this process. Rather than relying only on individual accounts, our advocacy has required reviewing incident data, identifying reporting gaps, comparing prevention strategies, and consulting nurses, hospitals, professional organizations, and policymakers about what can be implemented effectively.

    That process strengthened my view that recognizing a problem is not enough: policy must pair reliable reporting with practical prevention measures and clear accountability. It also reinforced the need to test whether a proposal produces measurable improvements rather than judging it only by its intent.

