    Oklahoma's orphaned well problem is one of the most significant long-term environmental liabilities our state faces. With an estimated 20,000 or more documented abandoned wells and a plugging timeline that could stretch over 200 years at current rates, we cannot afford to treat this like a background issue. I support the Well Repurposing Act and the bipartisan instinct behind it: turning a liability into an opportunity where the geology allows it. Converting suitable wells for geothermal energy or energy storage is a practical, market-friendly approach that can take pressure off the plugging backlog while creating new economic activity. I would support strengthening that framework as a state senator. That said, repurposing will not reach every well, and we cannot let it become a reason to slow down plugging the ones that cannot be converted. I would also support requiring stronger financial bonding from operators before they drill new wells so that future generations are not left holding the cleanup bill, and I would advocate for continued state and federal investment in accelerating the plugging of the highest-risk wells first, prioritizing those near drinking water resources and overburdened communities like those in Arcadia, Fort Gibson and Kingfisher. Oklahoma's energy heritage built this state. Cleaning it up responsibly is part of honoring that heritage.
    
    **Keywords:** Oklahoma's energy heritage built this state. Cleaning it up responsibly is part of honoring that heritage.
    
