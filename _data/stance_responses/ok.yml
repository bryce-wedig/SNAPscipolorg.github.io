  response: |
    Safety first. Safety second. Safety always. That is not just a slogan, it is a responsibility of government. It’s been a motto since nursing school. 

    As someone who believes public safety must be prioritized, I strongly support continued federal investment in NOAA, the National Weather Center, the National Severe Storms Laboratory, and the research infrastructure that helps protect communities from severe weather events.

    Oklahoma knows firsthand the importance of accurate forecasting, early warnings, and preparedness. Tornadoes, severe storms, flooding, and other extreme weather events can happen quickly, and timely information can mean the difference between life and death. Think back to Moore 2013. 

    When we invest in weather research, technology, and forecasting systems, we are investing in families, first responders, farmers, businesses, and communities. Severe weather preparedness is not just an environmental issue; it is a public safety issue and an economic issue.

    I will always support science-based decision-making and ensuring that our weather agencies have the resources necessary to continue improving forecasting, protecting lives, and keeping Oklahomans informed and prepared.
  
