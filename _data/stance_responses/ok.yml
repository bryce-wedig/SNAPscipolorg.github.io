  response: |
    Oklahoma has the opportunity to be a leader in technology and innovation, but growth must be responsible and cannot come at the expense of our communities, our natural resources, or our utility reliability.

    I support a statewide and federal moratorium on large-scale data center expansion until we have comprehensive assessments of water usage, energy demand, environmental impacts, and the long-term costs to ratepayers. Communities deserve transparency before decisions are made that could impact their infrastructure for decades.

    I have attended local government meetings where residents have raised concerns about the strain that large data centers could place on water systems, energy capacity, and local resources. Economic development should not mean existing residents bear the burden through higher utility costs or reduced access to essential resources.

    We have seen similar concerns arise with projects like the proposed Inola industrial smelter, where communities raised legitimate questions about environmental impacts, public health, and whether the benefits outweighed the risks. These conversations demonstrate why strong oversight and meaningful community input are necessary before approving projects that have long-term consequences.

    As a policymaker, I believe Oklahoma should welcome innovation while protecting the people who already call this state home. We need transparent utility planning, responsible permitting, environmental accountability, and a seat at the table for the communities most affected.

    Technology should serve Oklahoma… not force Oklahomans to sacrifice their water, energy security, health, or quality of life.
  
