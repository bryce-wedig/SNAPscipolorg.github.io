    I have serious concerns about the continued expansion of large data centers in Oklahoma because of the enormous demands they can place on electricity, water, and local infrastructure. I do not support providing state incentives to attract these facilities.

    If a data center does locate in Oklahoma, I believe it should bear the costs associated with serving its operation. Residential customers, farmers, small businesses, schools, hospitals, and other existing ratepayers should not see higher utility bills because a private company requires new substations, transmission infrastructure, generation capacity, or other major utility investments.

    I would support creating separate utility-rate structures for extremely large electricity users and requiring long-term contracts, financial guarantees, or other protections so Oklahoma ratepayers are not left paying for infrastructure if a project closes, scales back, or fails to materialize.

    I also believe these facilities should be subject to strong and continuing oversight. Utilities and developers should disclose projected energy demand, infrastructure requirements, expected impacts on rates, and any public incentives associated with a project. If the electric grid does not have the capacity to serve a proposed facility without threatening reliability or significantly increasing costs for existing customers, regulators should have the ability to delay or deny that development.

    Existing Oklahoma communities must come first. Homes, farms, hospitals, schools, and businesses already here deserve reliable and affordable electricity before enormous amounts of new capacity are committed to serving a data center.

    When projects are approved, I would support requiring or encouraging developers to reduce their burden on existing infrastructure through energy-efficient technology, investments in additional generation, alternative energy, or other measures that offset the demand they create.

    Local communities must also have a meaningful voice. A development of this scale should not be placed in a community without the people who live there having an opportunity to understand its effects on electricity, water, infrastructure, land use, and local finances and to participate in the decision-making process.

    I am not opposed to technological development, but I do not believe Oklahoma residents should have to sacrifice affordable utilities, water security, or infrastructure for data centers. If one is built here, it should pay its own costs, be subject to strong oversight, and the local community should have a meaningful say.
  
    **Keywords:** * Existing Oklahoma communities come first
    
