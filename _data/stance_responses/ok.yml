    I do not believe Oklahoma’s current policies are doing enough to protect our long-term water resources. Recent changes to reporting and enforcement may provide better information, and I strongly support collecting accurate water-use data, but better reporting alone does not solve the underlying problem. We need to make sure the decisions we make today do not leave our communities and agricultural producers without reliable water tomorrow.

    My priority would be simple: the people who already live here and the farms and ranches that sustain our communities should come first. Reliable drinking water for Oklahoma families and dependable access for agricultural producers should take priority when the state considers large new industrial water users.

    I am particularly opposed to bringing in large data centers that place significant demands on local water supplies. I support economic development and bringing good jobs to Oklahoma, but not every development is a good deal simply because it represents new investment. If a project threatens the long-term water security of the surrounding community or agricultural producers, I do not believe the state should sacrifice those existing needs in the name of economic development.

    I would support stronger requirements for major water users to disclose how much water they expect to use and where that water will come from. Oklahoma also needs accessible, reliable data showing actual water consumption so policymakers, communities, and producers can understand what is happening to our water resources rather than making decisions based on incomplete information.

    I would also support incentives that help farmers, municipalities, and businesses invest in water conservation. Producers who voluntarily conserve water should not be penalized for doing so. At the same time, the state should invest in rural water infrastructure, including repairing aging systems, reducing leaks, improving storage, and helping smaller communities modernize their water systems.

    Oklahoma absolutely should pursue economic development, but that development must be sustainable. Our water belongs at the center of that conversation, not as an afterthought. Local communities and agriculture should come first, and development should proceed only when we know our existing water needs are protected for the long term.
  
    **Keywords:**  * Reliable drinking water before industrial expansion * Accurate and transparent water-use data * Reward conservation, don’t punish it
    
