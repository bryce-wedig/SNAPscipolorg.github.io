    This is my JAM! As a nurse, rural healthcare is not an issue I learned about when I decided to run for office, it is something I understand from working in healthcare and from listening directly to rural Oklahoma communities and healthcare leaders.

    I strongly oppose federal Medicaid cuts that threaten healthcare coverage and the financial stability of rural hospitals. Medicaid is not simply an insurance program; in rural Oklahoma, it is part of the infrastructure that keeps hospitals, clinics, nursing facilities, pharmacies, and healthcare jobs in our communities. When a rural hospital closes, we do not just lose a building… we ultimately lose jobs, emergency care, maternal healthcare, preventive services, and precious minutes during medical emergencies.

    I support protecting and strengthening Medicaid, improving reimbursement for rural providers, expanding incentives and loan repayment programs to recruit and retain nurses, physicians, behavioral-health professionals, and other providers in underserved areas, and expanding telehealth while continuing to invest in actual brick-and-mortar healthcare access.

    I also believe we must invest heavily in maternal and postpartum healthcare, preventive care, mental healthcare, chronic disease management, and community based services. We cannot wait until Oklahomans are critically ill and then wonder why our healthcare system is overwhelmed. As a nurse, I believe in assessment, prevention, early intervention, and evaluating outcomes, and I will bring that same nursing process to policymaking.

    I've spoken directly with rural hospital leadership about the challenges they face, including workforce shortages, reimbursement, postpartum access, and keeping essential services available locally. Those conversations matter to me because Washington should not be designing rural healthcare policy without listening to the people actually delivering that care.

    Ultimately, I believe healthcare is a human right. My long-term goal is Medicare 4 All, because no Oklahoman should have to choose between seeking medical treatment and paying their bills, and no rural community should lose access to healthcare simply because providing it isn't profitable enough.
    
