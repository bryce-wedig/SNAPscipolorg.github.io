    I believe the first responsibility for remediating an abandoned or orphaned well should rest with the company that created the damage whenever that company can still be held accountable. If a company comes onto someone’s land, drills, and leaves behind infrastructure or environmental damage, it should be responsible for restoring that property and removing what it no longer needs. If there is a reasonable compromise regarding what remains on the property, that should be negotiated with the landowner rather than decided unilaterally by the company.

    I would support stronger bonding and financial-assurance requirements so that companies are setting aside enough resources to properly plug wells and restore land when operations end. Oklahoma should not routinely leave taxpayers responsible for cleanup after a private company has benefited from the resource.

    For wells where no responsible operator remains, I support using state or federal resources for remediation, but I would prioritize those funds carefully. Wells that present an immediate threat to public health, groundwater, nearby homes, farmland, or the environment should be addressed as quickly as possible. Lower-risk wells can be scheduled over a longer period as resources become available. Protecting the health and safety of Oklahoma communities should come first.

    I am also very open to safely repurposing suitable wells. If an unused well can be converted into geothermal energy, energy storage, or another beneficial use without creating new risks, I see that as an opportunity to turn an existing liability into something useful. However, repurposing should never become a loophole for avoiding cleanup obligations. It should require proper engineering review, monitoring, financial assurance, and a clear plan for eventual closure if the new use ends.

    Oil and gas remains an important part of Oklahoma’s economy and identity, but I also believe we should continue diversifying our energy portfolio. Developing alternative energy sources while preserving our traditional resources gives Oklahoma greater long-term security and flexibility. A diverse energy strategy can help us remain economically competitive while also protecting the reserves and resources we may need in the future.

    **Keywords:** * Protect groundwater and public health * No loopholes around cleanup obligation
    
