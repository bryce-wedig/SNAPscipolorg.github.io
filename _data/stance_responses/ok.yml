    Oklahoma has made real progress this session with the passage of landmark water legislation and nearly $73 million in infrastructure investment. I applaud those steps. But progress on paper is not the same as water in the ground, and I believe we still have work to do. I would support continued full funding of the Oklahoma Comprehensive Water Plan recommendations, particularly the voluntary agricultural water conservation programs that help farmers reduce usage without punishing them for it. I would also push for expanded investment in water monitoring and data infrastructure, because we cannot manage what we cannot measure, and the state's own plan acknowledges major data gaps that leave decision makers flying blind. For rural communities, I believe the new Water and Wastewater Infrastructure Investment Program is a good start, but smaller and underserved communities need guaranteed access to low-interest capital, not just competitive grants they may not have the staff capacity to apply for. Balancing agricultural, rural, and economic development needs means bringing all stake holders to the table BEFORE decisions are made, not after. I commit to doing that. 
    
