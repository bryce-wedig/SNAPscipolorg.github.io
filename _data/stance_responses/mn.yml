    “Every Minnesotan deserves safe drinking water. I would support a comprehensive PFAS strategy focused on prevention, testing, treatment, and accountability. Minnesota should continue phasing out nonessential PFAS uses under Amara’s Law and avoid loopholes that allow preventable contamination to continue. Stopping PFAS at the source is more effective and affordable than relying on communities to remove it later. I would expand monitoring of public water systems and private wells, require clear public notification, and provide state grants, bonding, and technical assistance for filtration systems, replacement wells, and other remediation. Communities should not have to choose between safe water and unaffordable utility bills. Because drinking water is only one source of PFAS exposure, treatment must be paired with broader pollution-prevention policies. I also support strong discharge standards and polluter-pays policies so responsible companies, rather than residents and taxpayers, bear cleanup costs. As a city council member, I understand the infrastructure burdens PFAS creates for local governments, and my Ph.D. in design and sustainability taught me to evaluate environmental decisions across their full life cycle.” 
    
