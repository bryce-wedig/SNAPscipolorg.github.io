- candidate_first_name: Amanda
  candidate_last_name: Matchett
  state: mn
  race: State House of Representatives
  district: 32A
  party: Democratic
  date: 2026-08-31
  question: mn-q2
  response: |
    “The Boundary Waters is an irreplaceable Minnesota resource, and I strongly support Governor Walz’s recent executive action protecting the Boundary Waters watershed from nonferrous mining. But an executive order is not a substitute for durable protection. I support legislation establishing permanent protections against sulfide-ore mining in the Boundary Waters watershed unless and until credible, peer-reviewed scientific evidence demonstrates that it can be done without jeopardizing the watershed.

    The Boundary Waters is an interconnected ecosystem, and contamination upstream could cause damage that is extraordinarily difficult, if not impossible, to reverse. When the potential consequences are that significant and permanent, our policy should reflect the science and the risk. Minnesota can support mining and economic development in appropriate places while recognizing that some natural resources are too valuable to gamble with.” 
    
    KEYWORDS: Boundary Waters, Science-Based, Permanent Protection

- candidate_first_name: Amanda
  candidate_last_name: Matchett
  state: mn
  race: State House of Representatives
  district: 32A
  party: Democratic
  date: 2026-08-31
  question: mn-q3
  response: |
    “Minnesotans should not have to wonder whether the water coming from their tap is safe. I support continued statewide PFAS monitoring, transparent public reporting, assistance for communities that must upgrade drinking-water treatment systems, and strong enforcement against significant sources of PFAS contamination. Minnesota should also continue reducing unnecessary uses of PFAS so that we are not simply paying to remove these chemicals from water after they have already entered the environment. Importantly, the financial burden of contamination should not fall primarily on homeowners and local ratepayers. State policy should continue applying the principle that those responsible for pollution bear an appropriate share of the cleanup costs.” 
    
    KEYWORDS: Clean Water, Prevention, Polluter Accountability

- candidate_first_name: Amanda
