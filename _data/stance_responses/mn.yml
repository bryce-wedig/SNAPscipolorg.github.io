- candidate_first_name: Gadisa
  candidate_last_name: Berkessa
  state: mn
  race: State Senate
  district: 31
  party: Democratic
  date: 2026-09-02
  question: mn-q2
  response: |
    “I oppose mining projects that could permanently threaten the Boundary Waters watershed. The Boundary Waters is an irreplaceable source of clean water, wildlife habitat, outdoor recreation, tourism, and jobs. Once this interconnected watershed is contaminated, restoring it may be impossible.

    I oppose the decision to overturn the 20-year mining protections. I would support strong state safeguards for the watershed, independent scientific review, meaningful consultation with Tribal Nations, and full consideration of cumulative environmental impacts. Mining companies must demonstrate that their operations will not pollute surrounding waters, and taxpayers must never be left responsible for cleanup costs.

    Minnesota can support responsible economic development and good-paying jobs without risking one of our most valuable natural resources. Decisions involving the Boundary Waters must be based on long-term scientific evidence, not short-term political or corporate pressure.” 
    
    KEYWORDS: Clean Water, Protection, Accountability

- candidate_first_name: Gadisa
  candidate_last_name: Berkessa
  state: mn
  race: State Senate
  district: 31
  party: Democratic
  date: 2026-09-02
  question: mn-q3
  response: |
    “Every Minnesotan deserves safe drinking water, regardless of their ZIP code or income. I support comprehensive testing of public water systems and private wells, transparent reporting of PFAS results, and prompt notification when unsafe contamination is found.

    The state should help affected communities install effective treatment systems and secure available federal funding, with priority given to small communities and families that cannot afford these costs. Minnesota should also identify and control PFAS at its source, strengthen monitoring of industries that use or release these chemicals, and hold responsible polluters accountable for cleanup expenses.

    I support continued investment in PFAS research, statewide contamination mapping, and assistance for communities to meet federal drinking-water standards. Prevention is less expensive and safer than allowing contamination to spread. The cost should not simply be passed to homeowners and local utility customers who did not cause the pollution.” 
    
    KEYWORDS: Safe Water, Prevention, Polluter Accountability

- candidate_first_name: Gadisa
  candidate_last_name: Berkessa
  state: mn
  race: State Senate
  district: 31
  party: Democratic
  date: 2026-09-02
  question: mn-q4
  response: |
    “Data centers can bring construction work, technology investment, and economic opportunities to Minnesota, but their benefits must be balanced against their significant demands on electricity, water, land, and public infrastructure.

    I support requiring large data-center proposals to undergo transparent assessments of their water consumption, energy needs, backup-generator emissions, noise, and effects on nearby communities. Reviews should consider cumulative impacts when multiple facilities are proposed in the same region. Companies should pay the full infrastructure and energy costs created by their projects so those expenses are not shifted to families or small businesses.

    I also support strong water-conservation and clean-energy requirements, responsible siting, public participation, and regular reporting of actual resource use. Any tax incentives should be transparent and tied to measurable benefits, including permanent local jobs, workforce training, and community investment.

    Minnesota should welcome innovation, but development must be responsible and should not leave residents with higher utility bills or fewer natural resources.” 
    
    KEYWORDS: Responsible Innovation, Resource Protection, Accountability

