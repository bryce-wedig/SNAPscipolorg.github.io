- candidate_first_name: Jeremy
  candidate_last_name: Munson
  state: mn
  race: State Senate
  district: 22
  party: Republican
  date: 2026-09-01
  question: mn-q1
  response: |
    “I follow a fairly scientific process when determining whether to vote for a bill, and there are two areas where scientists can help sway my vote: 
    1. Is it Constitutional?
    2. Does it unnecessarily grow government?
    3. Does the bill define a realistic path to achieving the results it seeks? (This is where my calls to scientists and constituents working in these industries comes in)
    4. Is it enforceable? 
    5. Is there a private, non-governmental solution or market force which could deliver the same or similar results? (this is also where scientists and constituents working in these industries can help weigh in)
    6. Does it end? (Does it sunset, or could this be a bad law that is difficult to remove? Can I force the legislature to evaluate its effectiveness before re-funding or re-authorizing?)” 
    
    KEYWORDS: Solutions Proven Results

- candidate_first_name: Jeremy
