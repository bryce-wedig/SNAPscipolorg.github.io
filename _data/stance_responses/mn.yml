    “Minnesota stewards roughly 20% of the nation’s fresh surface water, including the pristine Rainy River watershed, alongside domestic reserves that include 95% of the country's nickel and 34% of its copper resources. Protecting our water and advancing national mineral security are not mutually exclusive—they require pragmatic, non-political oversight. State authority through the DNR and MPCA must enforce rigorous clean water standards to protect critical watersheds. At the same time, we must support modern, highly regulated mining practices to prevent emergency mineral shortages during geopolitical crises that could force hasty development under lowered environmental standards.” 
    
    KEYWORDS: Watershed-Protection, Strategic-Minerals, Environmental-Review

