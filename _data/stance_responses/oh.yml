    Technological growth should not come at the expense of Ohio families, our natural resources, or the reliability of our infrastructure.

    I support an Ohio-first approach to data center development. Large data centers should bear the costs of the additional electric, water, and infrastructure capacity their operations require rather than shifting those costs onto residential ratepayers. Communities should also have access to clear information about projected energy and water consumption before major projects are approved.

    I support preserving meaningful local control over land-use decisions. What makes sense in one Ohio community may not make sense in another, and residents and local governments deserve a meaningful voice in development decisions.

    Finally, Ohio needs a long-term energy strategy that expands reliable generation and grid capacity alongside technological growth. We should encourage innovation in energy efficiency, water conservation, and cooling technologies so that economic development and environmental stewardship reinforce one another.

    Ohio can be a leader in advanced technology while protecting affordability, reliability, local communities, and our natural resources.

