    Immigration and visa policy is primarily a federal responsibility, but Ohio should be proactive in protecting our scientific and technical workforce.

    International students and researchers contribute significantly to our universities, research institutions and economy. When talented people come to Ohio, earn advanced degrees and want to contribute here, we should want them to stay, innovate and build businesses.

    I would work with universities and employers to identify workforce shortages created by federal visa changes and expand pathways for Ohio students into STEM, advanced manufacturing, engineering and research careers. Ohio can also help universities navigate changing federal requirements and advocate for predictable visa policies that protect national security without unnecessarily driving talented students and researchers elsewhere.

    Long term, we should reduce our vulnerability to workforce disruptions by developing more homegrown STEM talent while continuing to make Ohio a destination for talented people from around the world.

