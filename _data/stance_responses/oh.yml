    In Ohio, I would prioritize research that improves healthcare outcomes, strengthens advanced manufacturing, develops reliable and affordable energy, improves agriculture and water quality, and helps create technologies that can become new Ohio businesses and jobs.

    However, research funding should not become another form of corporate welfare. Grants should be competitive, transparent and regularly evaluated. Taxpayers should be able to see who received funding, why they received it and what resulted from the investment.

    I would evaluate success through measurable outcomes such as scientific advancement, patents and commercialization, improved health or environmental outcomes, new businesses, private investment attracted and quality jobs created in Ohio.

    Government can help innovation begin, but it should not permanently subsidize it.

