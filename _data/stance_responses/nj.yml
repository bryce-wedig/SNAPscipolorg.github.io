    New Jersey is home to universities, hospitals, researchers, pharmaceutical and biotechnology companies, and other institutions that contribute significantly to medical innovation. Federal research funding is not simply an expense. It supports jobs, trains scientists, strengthens our economy, and produces discoveries that can improve and save lives.

    I would oppose arbitrary or politically motivated cuts to peer-reviewed scientific research. Funding decisions should be based primarily on scientific merit, public need, research integrity, and potential benefit.

    I am also open to New Jersey supplementing federal research funding, including dedicated state support for areas such as cancer research. However, state funding should supplement rather than replace the federal government's role. Medical research benefits people across state lines and requires sustained national investment.

    I would also support strengthening opportunities for early-career researchers and ensuring that promising research is not abandoned simply because scientists face unpredictable funding cycles.

