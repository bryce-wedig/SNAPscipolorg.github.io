    Yes. New Jersey's experience demonstrates that enforceable standards, monitoring, and science-based regulation can reduce exposure to dangerous chemicals. I support continuing and strengthening that approach.

    At the federal level, I support strong EPA drinking-water standards for PFAS, continued research into their health effects, expanded monitoring, and federal assistance to communities facing expensive testing and remediation. We also need to address exposure beyond public water systems, including private wells, soil, air, industrial sites, and the movement of PFAS through our environment.

    I believe in the polluter-pays principle. The cost of cleaning up contamination should not simply be transferred to homeowners and taxpayers when responsible parties can be identified.

    I would also support funding to help private-well owners test their water and, when contamination is detected, obtain appropriate treatment or alternative water supplies.

    Finally, policy should evolve with the science. PFAS represents a large family of chemicals, and government should not wait for decades of damage before responding when credible scientific evidence identifies additional risks.

