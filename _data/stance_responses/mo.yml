  question: mo-q2
  date: 
  response: |
    "I strongly support continuing to grow Missouri's agtech industry. For 20 years, I worked as a trial lawyer representing Monsanto, including its subsidiaries Climate Corp. and Precision Planting, giving me firsthand knowledge of how agricultural science and technology drive Missouri's economy — $93.7 billion in output and over 456,000 jobs is not something to take for granted. I'll support continued investment in agricultural research, ag science education, and technical training so Missourians — not just outside companies — are the ones developing and benefiting from the next generation of agtech innovation. Missouri should be a national leader in agricultural science, and that means investing in the people and institutions that make it possible."

- candidate_first_name: Matthew R
  candidate_last_name: Grant
  state: mo
  race: US House of Representatives
  district: 2
  party: Republican 
  question: mo-q3
  date: 
  response: |
    "AI is the future whether we like it or not, and Missouri should get out in front of it rather than fall behind. Data centers bring real economic benefits — jobs, investment, and a stake in a growing industry. But growth can't come at the expense of everyday Missourians. I'll support commonsense restrictions to make sure data center development doesn't strain local power grids, drive up utility costs, or drain water resources that families and farmers depend on. Privacy protections also need to keep pace with the technology. The goal is balance: welcome the industry and the jobs it brings, while making sure it's a good neighbor to the communities it operates in."

- candidate_first_name: Matthew R
  candidate_last_name: Grant
  state: mo
