    "Nathanael Schultz believes rural hospitals and emergency rooms are essential infrastructure for Missouri communities. As hospitals continue to close across rural America, Congress should prioritize keeping emergency care available close to home. Schultz supports expanding targeted federal funding for rural emergency rooms, similar to proposals that would help stabilize access to emergency care in underserved communities.
    Schultz also believes protecting Medicare and Medicaid begins with restoring accountability to these programs. Nathanael Schultz supports deporting individuals who are in the United States illegally and ensuring taxpayer-funded health care resources are reserved for those who are legally eligible. In addition, Schultz will work to eliminate fraud, waste, abuse, and bureaucratic inefficiency so providers receive funding more efficiently and more of every taxpayer dollar reaches patient care rather than administrative overhead.
    For Nathanael Schultz, the goal is straightforward: preserve access to quality health care in rural Missouri while ensuring federal health care programs are financially sustainable, accountable, and focused on serving the American people."
  
- candidate_first_name: Nathanael
  candidate_last_name: Schultz
