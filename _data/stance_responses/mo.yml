  response: |
    "We should embrace the free market in our agriculture industry. The government doesn't have any place prohibiting farmers from engaging in free market activity. Farmers should be allowed to use their land for any purpose they see fit. Farmers should be allowed to sell their crops and product to whoever they want for whatever price they decide without interference from the government. Our farmers are an essential and crucial part of the American economy and the best thing government can do is stay out of their way, to not interfere with their operations, and to maximize their operational and economic freedom."
  
