    "Missouri's rural hospital closures are a crisis, and 42% of counties without a hospital is unacceptable. I support expanding telehealth infrastructure so rural patients can access specialists and primary care without traveling hours for an appointment. That starts with closing the broadband gap — telehealth only works if families actually have reliable internet access, so I'll support investment in rural broadband/wifi infrastructure as a healthcare issue, not just a connectivity issue. I'll also work to ensure federal rural health funding (like the Rural Health Transformation Program) reaches the hospitals and clinics that need it most, rather than getting absorbed into red tape. Access to care shouldn't depend on your zip code."

- candidate_first_name: Matthew R
