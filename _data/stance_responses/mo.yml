    "I would like to expand K-12 STEM education if at all possible from the federal level. I believe our current defund-the-schools Republican politicians want to prevent people from accessing high-quality education since they believe uneducated masses are easier to manipulate. Our current Republican leadership in Jefferson City and Washington DC are working to dismantle public education and make it harder for young people to improve themselves. Instead of investing in our future with our public schools, the Republican politicians are defunding the Department of Education at the federal level and destroying Missouri's finances at the local level. It is worth pointing out that the Republicans in my race are funded by the Herzog Foundation which buys politicians in Missouri so they can funnel taxpayer money to private religious schools. I support a federal ban on public taxpayer money being gifted to private religious schools. The lie we keep hearing is about 'school choice', but there is no choice when someone from Scotland county has a private school voucher and no private schools within an hour drive. The Republicans are funneling our taxpayer money to wealthy private school kids while our public schools literally collapse like the school gym did in Davies county last fall. I strongly support public education and the betterment of our future generations."
  
