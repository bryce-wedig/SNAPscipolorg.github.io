    "The best way to deliver healthcare services to the most people in the most efficient way possible is through the power of the free market. Unfortunately, we have nothing resembling a free market healthcare system in the United States. Our healthcare system is dominated by government control. We have the "Affordable Care Act", Medicare, Medicaid, USMLE and licensing requirements for all healthcare professionals and facilities, the FDA, an extensive IP racket, and draconian control over health insurance companies and the health insurance market. On top of all this we then have a financial system of compulsory taxation, fiat currency, money printing, and garden-variety uniparty special interest corruption and cartelism. This government stifling of the free market has done a great disservice to our rural communities.
    The best way to maximize healthcare access for individuals in rural areas is to remove this illegitimate and destructive government interference in the free market entirely. I advocate for complete and total separation of healthcare and state. The free market will drive down healthcare prices more than anyone can imagine and will improve healthcare quality and access for all people including those in our rural communities. The uniparty's endless expanding control of our healthcare industry has been a disaster. The only way to address this is to totally change course and to embrace a new direction focused on individual freedom."
  
