    "Science literacy matters (and one of my favorites!) because it affects health, jobs, agriculture, technology, energy, and the ability of citizens to understand the world around them. I believe K-12 science education should be practical, rigorous, and connected to real life.
    Students should understand basic biology, chemistry, physics, environmental science, agriculture, health, data literacy, and technology. They should also learn how to evaluate evidence, understand risk, identify misinformation, and ask good questions. Science education should not be about political messaging. It should teach students how to think clearly, test ideas, and understand the difference between evidence, opinion, and assumption.
    In Missouri, science standards should also connect to local needs: agriculture, water quality, conservation, health care, manufacturing, cybersecurity, and energy. I support strengthening STEM pathways, career and technical education, lab access, teacher support, and partnerships with local colleges, trade programs, farms, hospitals, and employers. Better science education can prepare students for good careers while also building public trust in science."

- candidate_first_name: Josh
  candidate_last_name: Smead
  state: mo
