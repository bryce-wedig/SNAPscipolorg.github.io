    "Missouri’s educational system trails behind most American states and many NATO and other developed countries, leaving our students and workers without the tools and critical thinking skills that they need to compete in a global economy. My plan builds a lifelong science‑literacy pipeline beginning in early childhood and continuing through K–12, career training, and union apprenticeships. It starts with universal, publicly funded pre‑K so every child enters school with strong early learning foundations. Investments in Head Start, teacher pay, and early‑childhood workforce pay ensure high‑quality classrooms in every community.
    I support strengthening pre-k through 12 STEM education through modern labs, rural broadband, safe school buildings, and expanded Career & Technical Education. Federal grants will support updated science curricula, teacher recruitment programs, and partnerships that connect students to hands‑on learning in agriculture, environmental science, engineering, and skilled trades.
    To bridge education and the workforce, my plan expands registered union apprenticeships and builds formal pathways from high school into the trades. Federal incentives will support apprenticeship programs in clean energy, infrastructure, advanced manufacturing, and climate‑resilient agriculture, while protecting collective bargaining rights.
    Finally, environmental and agricultural literacy will be integrated throughout the pipeline. Farm‑to‑school programs, water‑quality education, and rural STEM access ensure students understand the science shaping their communities. Investments in agricultural research and climate‑resilience training prepare the next generation of workers, farmers, and technicians to meet emerging challenges."
  
