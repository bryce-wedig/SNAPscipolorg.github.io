    I have been very disappointed with Texas' tepid response to the looming water crisis. To brag about massive budget surpluses, while watching our state outgrow it's water infrastructure, is political gross negligence. We need a plan that deals with water rights, supplies, usage, and conservation. And it should be wholistic and actionable. This will be one of the most consequential challenges we face, and it must be faced with very smart people, representing varied points of view, so that our policy is fair, economical, and effective. I can't think of any problem more pressing and more in need of independent, thoughtful leadership.
    
