    NIH-funded research has saved a lot of lives and has prevented a lot of human suffering both in the US and worldwide. Policies aimed at efficiency are fine, as long as they don't slow vital research and the advances being made. The indirect cost cap is an example of an "efficiency" policy that is pure foolishness. The folks who designed it were not intelligent enough to understand what they were doing. Good that the courts will take the time to get this right. We need to get back to intelligent policy making, not the nonsense we've seen lately from leaders who want to make headline for themselves, rather than scientific breakthroughs for mankind. I am a big, big believer in government funded research. It benefits everyone!

