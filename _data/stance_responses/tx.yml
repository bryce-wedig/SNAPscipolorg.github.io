    I was raised in the 1960's when we praised scientists who pioneered vaccines. We were proud and thankful that we lived in a country where science was eliminating childhood diseases one by one. Lately we have been misled by folks who twist science to support their fantasies about this or that consequence of vaccines. Peer-reviewed research if the only sound basis for health policy, and I will work hard to help people understand the difference between real and junk science. As far as I know, all peer-reviewed research confirms that measles vaccines save lives without any unwanted side effect. I therefore would support policy that gets everyone vaccinated against measles.

