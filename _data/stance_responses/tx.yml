    Concretely, that means I don't write policy without first talking to the scientists, engineers, and career agency staff closest to the evidence, APHIS veterinarians on screwworm, ERCOT engineers on grid reliability, TCEQ scientists on water quality, NIH-funded researchers on public health. When claims conflict, I weigh them by methodology, replication, and independence from whoever's funding the study, not by which side shouts louder. We already trust this model in daily life: we regulate aviation because we trust the engineering, we regulate food because we trust the inspections. Policy on energy, water, agriculture, and public health deserves the same rigor.

    When scientific consensus and public opinion diverge, my job isn't to pick the popular answer, it's to be honest about what the evidence shows and explain my reasoning clearly enough that people can see how I got there, even if they still disagree. That's different from ignoring public concern; real, lived experience often points to problems the data hasn't caught up to yet, and I take that seriously too. But I won't abandon evidence-based decisions because they're politically inconvenient. That's how you get outbreaks, blackouts, and billion-dollar mistakes.

