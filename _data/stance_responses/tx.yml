    I've served three years on my rural community's small water board. I've seen firsthand how hard rural systems fight for resources big cities take for granted — this isn't abstract for me.

    Texas floods in some counties and runs dry in others, with hundreds of polluted waterways on top of it. Voters just approved Prop 4, dedicating up to $1 billion a year to the Texas Water Fund starting 2027. Here's how I'd make it work:

    Get funding to rural communities first. Small systems often can't compete with big-city grant-writing departments. I'd push for direct technical assistance so our counties aren't left behind.

    Treat farmers and ranchers as partners. Ag conservation grants have saved 700,000+ acre-feet of water since 2014 on a shoestring budget. Expand that funding — don't treat it as an afterthought.

    Fix leaks before building new supply, with dedicated grants for rural systems. Most of our rural water lines date back to the 1970s and don't get replaced until a repair becomes essential. Rural areas can't afford to fix this on their own — grant funding for line replacement is cheaper in the long run than waiting for failures.

    Enforce clean water standards, with grants to help rural systems comply — not just deadlines they can't afford to meet.

    Plan flood and drought together. They're two sides of the same infrastructure failure.

    Water is the most basic promise a state makes its people. I'll fight to make sure this investment reaches small towns and family farms, not just the cities with the biggest lobbyists.

