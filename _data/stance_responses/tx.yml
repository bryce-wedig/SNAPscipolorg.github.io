    Water is one of the most important long-term challenges facing Texas. We need to prepare for both extremes—too little water during drought and too much water during major storms and floods.

    I would support sustained state investment in repairing aging and leaking water systems, expanding wastewater reuse and conservation, improving flood-control and drainage infrastructure, protecting water quality, and developing new water supplies where they are economically and environmentally responsible. Small and rural communities must have meaningful access to these investments and not be left behind because they lack the resources of our largest cities.

    Agriculture must also be part of the solution, but I do not believe the answer is simply restricting farmers and ranchers who help feed Texas and sustain our rural economies. I would expand voluntary agricultural water-conservation programs that help producers afford more efficient irrigation systems, water measurement technology, soil-management practices, and other improvements that conserve groundwater while keeping agricultural land productive.

    I would also prioritize protecting our aquifers and watersheds from contamination and strengthening monitoring and enforcement when pollution threatens drinking water, agriculture, wildlife, or public health.

    My approach would be guided by regional water availability, groundwater conditions, population growth, agricultural needs, infrastructure conditions, and sound science. Water policy also has to recognize that Texas is a diverse state, and a solution appropriate for a rapidly growing metropolitan area may not be appropriate for a rural agricultural community.

    Finally, as Texas considers major new industrial developments with significant water demands, we should account for those demands before approving incentives or infrastructure commitments. Farmers, ranchers, and existing communities should not be expected to conserve water only to see those savings consumed by new developments without adequate planning.

    Texas can protect agriculture while conserving water. I believe the better approach is to give producers the tools and incentives to become even more efficient, invest in the infrastructure our communities need, protect the quality of the water we already have, and make sure future growth does not come at the expense of the Texans who are already here.

