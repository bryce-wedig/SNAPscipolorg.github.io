    At the federal level, I would support maintaining a stable and predictable NIH funding system, including reasonable reimbursement for the facilities and infrastructure necessary to conduct federally funded research. I would oppose arbitrary, across-the-board reductions in indirect-cost reimbursement that do not account for the actual costs of maintaining laboratories, research facilities, regulatory compliance, cybersecurity, specialized equipment, and other infrastructure required to conduct modern medical research. At the same time, I support transparency and accountability so taxpayers can see how both direct and indirect research dollars are being used.

    At the state level, Texas should continue investing in research capacity and develop contingency strategies to protect critical research infrastructure when significant changes in federal policy threaten projects of particular importance to Texas. State resources should be targeted strategically rather than simply replacing every lost federal dollar, with priority given to research that has demonstrated scientific merit, economic value, opportunities for additional federal or private investment, and potential benefits for Texans.

    I would also support stronger partnerships among universities, hospitals, biotechnology companies, private foundations, and the state so Texas is not unnecessarily dependent on any single source of research funding.

    My guiding principle would be protecting Texas's long-term competitiveness. Once laboratories close, researchers leave, or major projects relocate to another state, rebuilding that capacity can be far more expensive than maintaining it. Texas should insist on accountability for taxpayer dollars while recognizing that medical and scientific research is infrastructure that creates jobs, attracts investment, trains our future workforce, and can ultimately improve and save lives.

