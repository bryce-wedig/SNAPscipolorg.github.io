    I support policies that put grid reliability first for Texas families and businesses.

    Extreme heat and rapidly growing demand—especially from large new loads such as data centers—continue to stress the ERCOT system. Reliability is not optional. When the lights go out, lives, livelihoods, and the economy are put at risk.

    Policies I would support:
    • Require large industrial users, including data centers, to secure or build adequate firm generation capacity so they do not free-ride on the existing system or drive up costs and risk for residential and small-business customers.
    • Expand incentives and streamlined permitting for reliable, dispatchable power—natural gas, nuclear, and other firm resources that can run when the wind is not blowing and the sun is not shining.
    • Strengthen weatherization and maintenance standards for critical generation and transmission assets without creating endless new bureaucracy.
    • Ensure market rules reward actual performance and availability during peak demand rather than subsidizing intermittent resources that leave the grid short when Texans need power most.
    • Maintain transparency on costs so ratepayers can see who is driving demand growth and who is paying for it.

    Texas must keep its independent grid, but independence only works if the system delivers power when people need it. My priority is clear: protect reliability for everyday Texans and the businesses that employ them, require big new loads to carry their own weight, and reject policies that sacrifice dependability for ideology or special interests.

