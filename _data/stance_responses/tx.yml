    I support aggressive, science-based eradication of the New World screwworm outbreak and stronger long-term agricultural biosecurity for Texas.

    The June 2026 detections in South Texas, now totaling dozens of confirmed cases, threaten our livestock industry and regional economy. A full-scale outbreak on the scale of 1976 could cost producers hundreds of millions and the Texas economy well over a billion dollars. Protecting cattle, sheep, goats, and the producers who raise them is a core Texas interest.

    I support full continuation of the USDA–TAHC response centered on the sterile insect technique—the same proven method that previously eradicated this pest from the United States. That includes rapid sterile-fly releases, targeted quarantines and movement controls in defined zones, intensified surveillance, and practical support for producers to prevent and treat wounds.

    I also support accelerating domestic sterile-fly production capacity in Texas, maintaining strong livestock import inspections and border surveillance, and ensuring producers have workable pathways to move healthy animals. Requirements should be time-limited, results-driven, and free of unnecessary bureaucracy.
The evidence is clear: sterile insect technique works, delay is expensive, and prevention at the border is cheaper than cleanup after the fact. Texas agriculture deserves decisive action and accountability, not half-measures.

