    New World screwworm is a serious threat to Texas agriculture, and we must respond with both immediate action and stronger long term prevention. I support restoring and strengthening the federal monitoring and detection programs in Central and South America that help identify screwworm before it reaches the United States. Reductions in this surveillance and prevention capacity created vulnerabilities that we cannot afford, particularly given the economic consequences of a large scale outbreak in Texas.

    We should also invest in rapid detection, expanded surveillance, veterinary services, research, and proven control measures such as sterile insect releases. Federal and state agencies should work closely with Texas ranchers, veterinarians, researchers, and agricultural organizations to ensure suspected cases are identified and reported quickly.

