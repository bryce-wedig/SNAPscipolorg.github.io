    https://patdixon.org/free-market-sustainability/ addresses sustainable resources.  One of the challenges is the long lead times on transformers.  Diversified energy sources provide competition and choice, and mitigate risk of capacity shortages.  It is important that large load interconnect fees cover the cost of additional demand.  As stated in Free Market Sustainability, any impact on growth (data centers, heavy industry, housing, etc) need to cover the cost of growth (power, water, roads, schools, emergency services, law enforcement, etc).  No more corporate welfare.
    
