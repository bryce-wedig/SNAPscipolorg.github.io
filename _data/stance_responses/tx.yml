    Because the federal government makes up such a large percentage of funding for our research institutions, Rep. Howard believes that this is an opportunity to generate bipartisan support among Texas policymakers at the state and federal levels. Representative Howard will work with her colleagues in the Legislature and partners in Congress to coordinate their efforts and ensure that Texas remains a priority state for research dollars.
 
    Another opportunity to ensure that Texas remains competitive for research funding is to encourage more joint proposals from higher ed institutions. For example, Representative Howard recently attended a technology and innovation forum where Dr. Jeff Prevost of UT San Antonio described the joint proposal submitted by 16 Texas universities and 3 national labs in response to the National Science Foundation’s Quantum Leap Challenge. While this proposal unfortunately didn’t get selected, it created a much more interconnected research ecosystem that could serve as a model for leveraging all of our top-tier research institutions for competitive funding. 

