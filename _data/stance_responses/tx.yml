    Having access to a sustainable supply of water is probably the most critical issue facing Texas’s long-term viability. One of the greatest challenges surrounding water policy across the state is the diversity of water systems, which all require different solutions. Representative Howard believes that the Legislature can be most effective by adequately funding supply, infrastructure, and conservation projects that local water development boards identify. This is no small task, and will require massive new funding commitments. 

    According to the 2027 State Water Plan, the state will need to invest $174 billion over the next 50 years to keep up with the water demand. While Rep. Howard appreciates the Legislature’s $20 billion appropriation for water infrastructure and supply projects over the next twenty years; she believes that Texas needs a more sustainable funding mechanism. Last session, she authored HJR 126, which would’ve transferred excess dollars from the state rainy day fund into the Water Fund and provide a more consistent stream of dollars without the need for new appropriations. Unfortunately, this legislation didn’t pass last session but she will continue working with her colleagues on innovative solutions to increase funding for water.

    Another key part of addressing the water crisis to improve conservation efforts and replace outdated infrastructure. When considering the water needs of the state, it's important to factor in the supply we currently have. Representative Howard believes is very supportive of increasing funding for conservation and reclamation programs. For example, the City of Austin’s purple pipe program reclaims wastewater for irrigation, cooling, and toilets. This reclaimed water is less expensive than drinking water to treat, making it a smart investment for the state to help cities preserve potable water for their growing populations.

    When faced with policy decisions on agricultural water use, Representative Howard believes it’s important to work with legislators and local water planning groups whose communities are directly impacted by these policies. Additionally, she often consults the expertise of universities with robust agricultural and environmental research programs such as Texas A&M. 

    A final key policy issue to address the state’s water crisis is reforming our planning process to provide legislators with more up-to-date information on water usage. Representative Howard believes that the Texas Water Planning process should be updated on a biennial basis rather than every five years to help legislators make more informed decisions based on current data. This would allow legislators to be more responsive to sudden changes in water usage such as the explosion of data centers or new conservation technologies becoming available across the state.

