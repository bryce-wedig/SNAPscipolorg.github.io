    Our farmers and ranchers are not only feeding Texas, they are holding together the economies of our rural communities. When something like New World screwworm threatens their livestock and livelihoods, I believe the state has a responsibility to respond quickly, transparently, and with the people actually working the land at the center of that response.

    I would support strong coordination between the Texas Animal Health Commission, Texas Department of Agriculture, USDA, veterinarians, local officials, and livestock producers. That includes fully funding surveillance and rapid testing, making sure producers know exactly how and where to report suspected cases, and ensuring state veterinary and animal-health personnel have the resources to respond immediately when a case is identified.

    I would also support continued use and expansion of proven eradication tools, including the sterile insect technique, which has historically been critical in controlling New World screwworm. Texas should work aggressively with federal partners to ensure adequate sterile-fly production and deployment wherever surveillance indicates it is needed. I do not want Austin making agricultural policy from behind a desk without listening to the people who raise our cattle and work our land. My approach would be to listen to producers, veterinarians, and agricultural experts; follow the best available science; act early; and make sure Texas farmers and ranchers are never expected to shoulder a statewide biosecurity crisis alone.

- candidate_first_name: Diana
  candidate_last_name: Loya
