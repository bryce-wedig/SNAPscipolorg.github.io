    Texas needs stronger flood warning systems, better drainage, updated water and wastewater infrastructure, and more support for rural communities.

    At the same time, we have to prepare for drought and protect our groundwater. Farmers and ranchers should be part of the solution. I support helping them afford better irrigation systems, water-saving technology, and other conservation tools without threatening their livelihoods.

