    Texas faces the dual challenge of flood risk and long-term water shortages driven by drought, groundwater depletion, and growth. Hundreds of waterways remain impaired. Agriculture is the largest user of groundwater and must be treated as a partner, not an adversary, in any workable solution.

    Policies I would support:
    • Prioritize funding and permitting for projects that deliver measurable results: reservoir expansion and new storage where scientifically justified, flood-control infrastructure in high-risk basins, and upgrades to aging treatment and distribution systems that improve both quantity and quality.
    • Expand voluntary, market-based conservation tools for agricultural producers—cost-share programs for efficient irrigation, aquifer recharge projects, and water-marketing options—rather than top-down mandates that threaten farm and ranch viability.
    • Strengthen local groundwater conservation districts and regional water planning groups so decisions stay closer to the people who live with the consequences, while ensuring clear accountability and data transparency.
    • Require that major industrial users (including data centers) pay the full cost of the water and wastewater capacity they demand so residential customers and agricultural producers are not subsidizing them.
    • Support practical water-quality improvements focused on the highest-impact pollutants without creating new regulatory layers that slow infrastructure delivery or raise costs without clear benefit.

    Considerations guiding this approach:
    Agriculture feeds Texas and the nation. Policies that undermine producers through excessive regulation or water cutbacks without alternatives will damage rural economies and food security. At the same time, unchecked groundwater mining and polluted waterways harm everyone downstream. The guiding principle is results over process: build the infrastructure we need, protect property rights, keep costs transparent, and treat farmers and ranchers as essential partners in conservation rather than targets of restriction. Texas can secure reliable water supplies without sacrificing the agricultural foundation that has sustained the state for generations.

