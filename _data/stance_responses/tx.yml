  question: tx-q2
  date: 2026-08-27
  primary_candidate: false
  response: |
    Texas has no state rule that checks how private building projects affect the environment. Data centers show why that's a problem. Here's my plan.

    First, bigger projects would face bigger reviews. If a project would use a huge amount of electricity or water, it would have to pass a state review first. The state would look at where its water comes from, how it stays cool, and how it affects the power grid. The project couldn't get water service or connect to the grid until it passed.

    Second, tax breaks would come with strings attached. Companies would only get them if they create real jobs and meet standards for saving water and energy. If they break those promises, they pay the money back.

    Third, big power users would pay their own way. They'd cover the cost of hooking up to the grid and building new power lines. They'd also agree to use less power when the grid is strained—so families don't see their electric bills go up to pay for data centers.

    This plan is based on facts. State forecasts show power demand growing fast. State water data shows our underground water supplies are under stress. And past tax break programs didn't always deliver what they promised.

