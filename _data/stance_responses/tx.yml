    Data centers will be essential to national security and economic vitality in this country. But it makes no sense to site them where the demands on infrastructure cannot be met without substantial disruption and cost to local residents and businesses. My shorthand way of saying this is "bring your own water and bring your own power!" Policy must not result in a strain on Texans, from a supply and cost standpoint, to help datacenter operators make more money. I'll fight hard against that! I also believe that Texas sounds beautiful! I can't imagine living near a highway for that reason, and I believe Texans have every right to live where it's quiet and sounds like Texas. Again, I will fight against any policy that ruins our tranquility and the quiet enjoyment of our homes and communities in order to boost corporate profits.
    
