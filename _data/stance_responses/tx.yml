    I would support continued investment in dependable generation, including natural gas and nuclear power, while also expanding wind, solar, battery storage, and other technologies where they can economically strengthen the grid. Texas should not become overly dependent on any single source of electricity. A diverse energy portfolio makes our grid more resilient.

    Generation alone is not enough. I would support accelerating necessary transmission improvements, strengthening weatherization and emergency preparedness, and investing in technologies that allow electricity to move more efficiently from where it is generated to where Texans need it.

