    Texas universities and hospitals receive roughly $1.9 billion in annual NIH funding that supports tens of thousands of jobs and advances medical and scientific work with real benefits for patients and the economy. Indirect cost reimbursements cover the facilities, administration, and infrastructure required to conduct that research. An abrupt 15% federal cap would cut an estimated $300 million per year that institutions would be forced to absorb or shift onto other sources.

    Policies I would support:
    • Oppose arbitrary federal caps that ignore negotiated rates and suddenly shift hundreds of millions in costs onto Texas institutions and, ultimately, Texas taxpayers or tuition payers.
    • Require greater transparency and efficiency in how indirect cost rates are calculated and used, so funding prioritizes actual research capacity rather than administrative bloat.
    • Maintain competitive federal research investment that rewards results and excellence, not simply volume of spending.
    • At the state level, resist pressure to automatically backfill federal reductions with new general-revenue spending. Institutions should first examine internal efficiencies, and any limited state support should be targeted, temporary, and tied to clear performance expectations.

    Texas benefits when its research enterprise remains strong. Federal partners should not impose sudden, across-the-board cuts that undermine that capacity while claiming to promote efficiency. The responsible path is stable, accountable funding that sustains high-quality research without transferring the bill to Texas families or forcing institutions into sudden shortfalls.

