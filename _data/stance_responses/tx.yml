    I serve on the House Natural Resources Committee, but I have also seen these issues up close through the humitarian work i do with my nonprofit,  Uniting America Outreach.

    During the July 4, 2025 Historic Hill Country floods, we helped organize volunteers, move supplies, support search and recovery efforts, and assist families who had lost nearly everything. That experience made it clear that flooding is not just an infrastructure issue. It is about whether families get warned in time, whether roads and bridges hold up, and whether communities have the resources to respond. Then again, on my birthday, this year, July 16, 2026, not only did the Hill Country experience a similar flood, but this time it extended to Uvalde County with the flooding of the Nueces River. 

    Texas needs stronger flood warning systems, better drainage, updated water and wastewater infrastructure, and more support for rural communities.

    At the same time, we have to prepare for drought and protect our groundwater. Farmers and ranchers should be part of the solution. I support helping them afford better irrigation systems, water-saving technology, and other conservation tools without threatening their livelihoods.

