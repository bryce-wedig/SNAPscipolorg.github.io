      Pennsylvania’s energy strategy must balance our historical strength as a top natural gas and nuclear producer with our 45th-place ranking in renewables. In line with the mission of the AFL-CIO, our energy transition must be worker-centered, family-sustaining, and focused on economic justice.
      
      I support updating the Alternative Energy Portfolio Standards (AEPS) to aggressively scale up wind, solar, and hydropower production. However, this expansion must incorporate strict prevailing wage requirements and Project Labor Agreements (PLAs) to ensure that new clean energy infrastructure is built by highly skilled, unionized Pennsylvania workers.
      
      Furthermore, we cannot leave traditional energy communities behind. I advocate for policies that invest state resources into a "just transition"—including dedicated union apprenticeship pathways and retraining programs that bridge displaced fossil-fuel workers directly into high-paying clean energy and grid-modernization jobs. By protecting existing baseload nuclear and gas strengths while mandating strong labor standards for renewable expansion, Pennsylvania can modernize its electrical grid, lower consumer costs, and lead the nation in a clean energy economy built by union labor.
      
      KEYWORDS: Clean energy project labor agreements, just-transition, grid modernization
      
- candidate_first_name: Cherri
  candidate_last_name: Rogers
  state: pa
  race: State House of Representatives
  district: 58
  party: Democratic
  question: pa-q5
  date: 2026-06-17
  primary_candidate: false
  response: |
    The expansion of large-scale data centers offers economic potential, but Pennsylvania must prioritize ratepayer protection, community health, and high-quality jobs. In alignment with the AFL-CIO mission, I support shifting all infrastructure, generation, and grid-reliability costs entirely onto developers via Project Labor Agreements (PLAs), ensuring this digital infrastructure is built and maintained by highly skilled, unionized local labor without burdening ordinary ratepayers.
    
    To protect public health and local ecosystems, we should replicate the success of Pennsylvania townships that have enacted strict municipal restrictions. I support mandatory zoning guidance, strict power usage effectiveness (PUE) caps, and closed-loop water cooling mandates to prevent the depletion and thermal pollution of local watersheds. Furthermore, comprehensive environmental and grid-impact reporting must be publicly disclosed before any project approval.
    
    By enforcing strict transparency, utility oversight, and resource restrictions, we can prevent data centers from straining our electrical grid or compromising community health. This balanced approach ensures tech developers pay their fair share, local natural resources are legally protected, and the economic benefits of technological innovation directly support working families.
    
    KEYWORDS: Ratepayer-protection, Township-zoning-restrictions, union-labor-infrastructure-data centers 
    
