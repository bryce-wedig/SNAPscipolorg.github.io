    I’m a conservationist. I have utility bills that are too high. Like so many people, I have serious concerns about the potential impact of data centers on our environment and energy costs. We need strong guardrails in place to protect our communities and our state’s beautiful natural resources.

    I’ve been a strong advocate for House Bill 1834: Rep. Matzie’s Data Centers and Consumers bill. This omnibus set of strict guardrails would:

      -Prevent data centers from passing energy costs onto ratepayers by mandating that they produce their own energy, increasingly from clean sources paired with battery storage
      -Insist that data centers make payments towards LIHEAP, our state’s low income energy assistance program
      -Prevents the costs of infrastructure upgrades required for data center construction from getting passed on to consumers. 

    Data centers must be held accountable to the public:I’m in favor of annual reporting standards for data centers that would disclose energy and water usage and compare those statistics to past years and projections. 
    
    Finally, I’m fully in favor of communities getting their say about data center proposals in their region—for that reason, I’ve introduced a data center zoning ordinance in my borough, where I serve as council president.

