    Yes, Pennsylvania should restrict PFAS in consumer products, especially where those chemicals are intentionally added and safer alternatives are available. PFAS are often called “forever chemicals” for a reason: many of them persist in the environment, build up in the human body, and create exposure pathways that families never knowingly signed up for. When we are talking about products like cosmetics, dental floss, menstrual products, and children’s products, the burden should be on manufacturers to prove those chemicals are necessary and safe, not on the public to absorb the risk.

    The scientific case for action is strong enough to justify restrictions now. I would rely on three kinds of evidence. First, exposure science shows that PFAS are highly persistent and that many people already have measurable PFAS in their blood. Second, human epidemiology reviewed by EPA, ATSDR, and the National Academies links PFAS exposure to higher cholesterol, reduced vaccine response and other immune effects, pregnancy-related harms, lower birth weight, and increased risk of some cancers. Third, toxicology reviews, including the National Toxicology Program’s work on PFOA and PFOS, show credible evidence of immune-system harm. Science is still evolving across the thousands of PFAS compounds, but that uncertainty is a reason to be more careful with non-essential uses, not less.

    That is why a targeted approach like House Bill 2145 makes sense. As of July 24, 2026, the bill has passed the House and is in the Senate after being referred on June 11, 2026. It focuses on intentionally added PFAS in a defined set of consumer products and includes carveouts for things like FDA-approved drugs and medical devices. That is a practical, science-informed way to reduce avoidable exposure while still recognizing that some uses may require a different regulatory path.

- candidate_first_name: Austin
  candidate_last_name: Graham
  state: pa
