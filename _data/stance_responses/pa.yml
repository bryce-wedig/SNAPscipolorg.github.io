  response: |
    It is critical to public health and environmental stability that Pennsylvania places strong restrictions on "forever chemicals" (PFAS). To inform my decision on House Bill 2145 and future legislation, I will rely heavily on robust, peer-reviewed scientific research, epidemiological studies, and environmental data. 
    
    Your highly convenient and vital resource for an evidence-based vote is the Scientsit Network for Advancing Policy (SNAP) website, which bridges the gap between early-career researchers nd policy solutions. However, beyond curated platforms, I am fully educated in how to independently locate, evaluate, and synthesize primary scientific literature.
    
    My decisions will be guided by toxicological data from agencies like the EPA and CDC, tracking PFAS bioaccumulation in human tissue and its links to adverse health outcomes, including metabolic disruption and immune system suppression. Furthermore, I will utilize hydrological and soil testing data specific to Pennsylvania's waterways to identify contamination hotspots. By balancing cutting-edge peer-reviewed research with community-level environmental monitoring, I will support policies that protect Pennsylvanians from cumulative chemical exposure while ensuring our regulatory frameworks are grounded in definitive, non-partisan science.

    KEYWORDS: forever-chemicals, serum concentration kinetics, PFAS maternal-fetal transfer, PFAS human biological half-life

    
- candidate_first_name: Cherri
  candidate_last_name: Rogers
  state: pa
  race: State House of Representatives
  district: 58
  party: Democratic
  question: pa-q2
  date: 2026-06-17
  primary_candidate: false
  response: |
    As both a public health expert and a public school nurse, I view declining MMR vaccination rates—now at 92.5%, below the 95% herd immunity threshold—as an urgent student safety crisis. With 66 confirmed cases emerging across Pennsylvania this year, top-down mandates alone fail. My approach centers on high-touch community engagement: holding empathetic, non-judgmental listening sessions in schools and community centers where parents can voice safety anxieties directly to frontline clinicians.
    
    I will counter misinformation not with lectures, but with transparent, accessible, and non-partisan data highlighting the severe risks of measles complications versus proven vaccine safety profiles.
    
    Politically, I support policies that strengthen the authority and funding of school nursing infrastructure, position school health suites as trusted public health hubs, and expand mobile, school-based vaccination clinics to eliminate socioeconomic barriers to access. Furthermore, I advocate for closing non-medical exemption loopholes for school enrollment and implementing standardized, mandatory immunization education for parents seeking exemptions. By leveraging the trusted, everyday relationships between school nurses, local pediatricians, and families, we can rebuild community trust, restore herd immunity, and keep Pennsylvania’s classrooms safe and open.
    
    KEYWORDS: measles immunization and vaccination, coverage trends, Public health interventions, nonmedical exemption policy legal studies

    
- candidate_first_name: Cherri
  candidate_last_name: Rogers
  state: pa
