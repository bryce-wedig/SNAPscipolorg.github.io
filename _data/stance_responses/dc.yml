    As the Nominee for the DC Statehood Green party I think science is the most important aspect or reality we can lean into about not just being greener but also our advancement towards a self reliant and self sufficient state. The dream of our capital city becoming the city of the future doesn't happen because we have a single forum about it, it happens because we invest in our city and the minds within it.

    The funding within the district needs to redirect its priorities in the first place, less evasive action and more preventative, in health, safety, productivity and even legislatively. The current scientific community in DC receives roughly $40–60 million every year across all factors of our governance, safety, education and health to name a few and I think that's just the beginning, from research into how to better manage energy to my urban agriculture projects, science will be protected under the HLS and the Gross Administration.

    Keywords: Quality of Life (QOL), Structural Audit, Dashboards + Indicators

