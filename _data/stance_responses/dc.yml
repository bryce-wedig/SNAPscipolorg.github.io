  response: |
    During COVID, I administered some of the first vaccine doses in the District. I also watched more than 40 percent of DC's supply go to non-residents while my Ward 8 neighbors could not get appointments. I went to the FEMA site at Greenbelt Metro and pushed until DC residents were let in. That taught me vaccine access depends on who writes the rules.

    Vaccine guidance should rest on evidence and on the clinicians who review it. It should not shift with whoever controls HHS. When federal recommendations become unreliable, medical professionals and parents are left unsure what is covered and what is allowed.

    I support DC Health issuing its own evidence-based guidance, drawing on professional bodies like the American Academy of Pediatrics, and coordinating with neighboring jurisdictions to keep standards consistent across the region. I will push to ensure DC law lets pharmacists keep vaccinating under that guidance, and that Medicaid and private insurers keep covering those vaccines at no cost to residents.
    The resident physicians of CIR/SEIU, who endorsed my campaign, see the cost of confused guidance every shift. DC's public health should not be hostage to federal politics.  

    Keywords: Evidence Based Guidance, Vaccine Access, Public Health

