      The science on childhood vaccines is settled: they're safe, they work, and when coverage falls outbreaks can follow.
      
      But I don't believe Tennessee will get back to 95% by ordering people around. In public health, trust has to stay high, and mandates from Nashville tend to lower it. My approach is to reduce barriers and increase incentives to get the behavior we need. That means keeping vaccines free, bringing them to where families already are through school-based clinics and county health departments, and compensating parents for time and travel in the counties furthest below the line. My plan puts twice-daily buses and a community health center in every county, which gives rural families a pediatrician instead of a two-hour drive.
      
      I'd also have the Department of Health publish county-level coverage every year, so communities can see where they stand and local doctors, pastors, and school nurses can lead the conversation. They're trusted in ways a governor isn't.
      
      Many under-vaccinated kids aren't refusers. Their families lacked access or incentives. I'd fix access and incentives, and let trusted people do the persuading.

