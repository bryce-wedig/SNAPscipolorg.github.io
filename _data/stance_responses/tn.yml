      Trust in science isn't lost because scientists are wrong. It's lost when people can't relate to the communication or understand the work, when they had no stake in the process, and when leadership casts doubt on it.
      
      First, we have to make public communication about science simple, friendly, and encouraging. If it's too complex it's alienating, and if it's too absolute it's off-putting. My plan creates a Tennessee Outcomes Commissioner with a fixed term and independence from the governor who publishes plain-language annual reports on living standards and environmental quality, so Tennesseans can see whether a policy is working for their family, not just whether it passed.
      
      Second, give people input. My Office of Civic Design brings randomly selected Tennesseans together, supported by experts, to tell the legislature what to focus on now and ten years out, and lawmakers must respond in writing within 90 days.
      
      Lastly, I'll support scientific literacy and research. I'd create the TRAC Fund to match university investment to recruit researchers and help them build Tennessee companies. People trust science they can see working in their own town.



