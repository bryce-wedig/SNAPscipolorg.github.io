      I attended an Oak Ridge City Council work session where the cost of new transformers was discussed. It was brought up that the cost of large transformers had tripled since 2007, and that rates had increased by 22%, mostly due to increased charges from TVA that were passed on to ratepayers.

      The logical consensus of the council was that projects requiring new transformers should be responsible for paying a large percentage of the cost in order to reduce or eliminate the cost being borne by ratepayers.

      Specific policies: Data centers should cover 100% of the cost of the infrastructure required to power their operations. Projects must not adversely affect air quality or contribute to sound or light pollution.

      The will of the residents of the surrounding area must be taken into account. They have the right to deny industry coming into their community. A case in point is the federal government's plans to develop a nuclear waste dump in Rhea County. The citizens are against it, and it should not be built. The United States has already spent 100's of million of dollars developing the Yucca Mountain site in Nevada. Put the waste site somewhere besides Rhea County; the people there don't want it.

      There is a big push to connect the building of Small Modular Reactors (SMRs) to powering data centers, with the argument being that data centers would come with their own source of energy.

      I started raising goats in 2012. I made the mistake of getting the goats before I fixed all the fences. I learned from my mistakes, and I would not support the building of data centers before the power source was in place—not just talked about. Building more nuclear plants before you have a way of safely disposing of the waste is irresponsible.

      
