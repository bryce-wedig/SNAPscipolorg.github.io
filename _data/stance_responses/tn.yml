      Tennessee can't wait on Washington or TVA to fix this. I'd pass a moratorium for up to 24-months to give us time to set up the proper standards, and end it sooner if the standards are established. My comprehensive five-policy-plan for AI and datacenters is on my site, just scroll down and click data centers.
      
      Regarding bills: I’d have data centers pay upfront for the wiring and transmission they need, post financial security before they connect, and match 110% of their consumption with new clean generation on the same grid, hour by hour. Fall short and they pay a rising charge per megawatt-hour; three shortfalls in five years and they're suspended. TVA's new capacity charge is a step in the right direction, but a 10% increase phased over three years doesn't cover what these facilities cost the rest of us.
     
      Regarding reliability: my plan calls for placing data centers on our grid with two hour backup by battery, and only allows fossil fuel power or critical life support systems. I believe this creates incentives for data centers to invest in a grid that’s safe for us, too.
      
      Regarding air quality: the primary purpose of the moratorium is to set up an Environmental Justice Division inside TDEC with authority to deny permits that push a community past safe limits, publish a public map of health burdens like pollution, and the power to shut down unpermitted operations. What xAI did in Memphis would be illegal under my plan.

