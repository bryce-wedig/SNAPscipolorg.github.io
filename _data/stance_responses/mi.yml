    "Michigan's farmers face increasing challenges from weather variability, global competition, labor shortages, and rising costs. Research and innovation can help improve productivity, crop resilience, resource efficiency, and profitability. I support partnerships among farmers, universities, and the private sector to develop practical solutions that help producers remain competitive. Investments should prioritize real-world applications that strengthen domestic food production, reduce costs, and support rural communities."

    KEYWORDS: Agriculture, Innovation, Competitiveness

- candidate_first_name: Steffan
  candidate_last_name: Demetropoulos
  state: mi
  race: US House of Representatives
  district: 10
  party: Republican
  question: mi-q4-governor-house
  date:
  response: |
    "Every Michigan resident deserves access to safe drinking water and reliable infrastructure. I support investments in upgrading aging water systems, replacing failing infrastructure, and addressing contamination that threatens public health. Protecting the Great Lakes is both an environmental and economic priority. Federal resources should be used responsibly and in partnership with state and local governments to ensure clean water while minimizing unnecessary regulatory burdens that hinder growth and development."

    KEYWORDS: Infrastructure, Clean Water, Great Lakes

- candidate_first_name: Steffan
  candidate_last_name: Demetropoulos
  state: mi
  race: US House of Representatives
  district: 10
  party: Republican
  question: mi-q5-governor-house
  date:
  response: |
    "Many communities face shortages of healthcare providers, especially in rural and underserved areas. Expanding access to telehealth, supporting workforce development, and reducing barriers to care can help address these challenges. Emerging technologies can improve healthcare delivery, enhance diagnostics, and increase efficiency, but they should complement, not replace, the relationship between patients and healthcare professionals. The goal should be accessible, affordable, high-quality care for all communities."

    KEYWORDS: Access, Telehealth, Workforce

- candidate_first_name: Steffan
  candidate_last_name: Demetropoulos
  state: mi
  race: US House of Representatives
  district: 10
  party: Republican
  question: mi-q7-house-senate
  date:
  response: |
    "America needs a reliable, affordable, and secure energy supply to support economic growth, manufacturing, and national security. I support an all-of-the-above energy strategy that includes natural gas, nuclear power, renewables, and emerging technologies. Energy policy should prioritize reliability, affordability, and domestic production while encouraging innovation and responsible stewardship. No single energy source can meet future demand alone, especially as manufacturing and data centers increase electricity consumption."

    KEYWORDS: Reliability, Affordability, Energy Security

- candidate_first_name: Steffan
  candidate_last_name: Demetropoulos
  state: mi
  race: US House of Representatives
  district: 10
  party: Republican
  question: mi-q9-governor-house
  date:
  response: |
    "Artificial intelligence and data centers are becoming increasingly important to economic growth, manufacturing, healthcare, and national security. Policies should encourage innovation while ensuring adequate energy infrastructure, grid reliability, and responsible resource management. The federal government should support infrastructure improvements that allow technological growth without compromising affordability or reliability for households and businesses. Regulatory approaches should provide clear rules while preserving America's leadership in innovation and technological development."

    KEYWORDS: Privacy, Grid Reliability, Local Control
