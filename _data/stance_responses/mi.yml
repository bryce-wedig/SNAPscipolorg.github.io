    "Scientific research has helped improve healthcare, agriculture, manufacturing, and national security. Federal investment should focus on areas that strengthen America's competitiveness, improve quality of life, and address clear national priorities. Taxpayer-funded research should be subject to rigorous oversight, measurable outcomes, and public accountability. I support investments that advance innovation, develop new technologies, support critical industries, and produce tangible benefits for American families and businesses."

    KEYWORDS: Innovation, Accountability, Competitiveness 

