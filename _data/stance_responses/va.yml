    I support technological innovation and economic development, but Virginia families and small businesses should not be forced to subsidize the enormous electricity demands of private data center developments.

    My proposed Data Center Community Consent Act would require developers to pay the full costs of infrastructure improvements their projects create, including electrical grid upgrades, without passing those expenses on to residential customers.

    I would also support transparent utility pricing and stronger safeguards to ensure that large industrial electricity consumers pay their fair share of the costs they impose on the grid. Independent assessments should determine those costs before projects receive approval.

    Data centers can bring investment and tax revenue to our communities, but those benefits must be weighed against their impact on electricity rates, infrastructure, and natural resources.

    The principle is simple: Virginia families should not pay higher electricity bills to finance the infrastructure needs of multibillion-dollar corporations.
   
