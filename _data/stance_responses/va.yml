    I support technological development, but not at the expense of our farmland, natural resources, property rights, or rural communities.

    That is why I proposed the Data Center Community Consent Act, one of my five major legislative initiatives. It would require independent environmental and infrastructure impact studies paid for by developers, along with approval from two-thirds of directly affected property owners. Developers must also cover infrastructure costs rather than passing them on to residents and taxpayers.

    My American Working Farms Act complements this proposal by reducing federal tax burdens on working farms and helping preserve their economic viability.

    Local governments should maintain land-use authority while ensuring transparency and protecting agricultural land, water resources, and neighboring property owners.

    Technological progress should strengthen our communities, not come at the expense of the people and farmland that sustain them.
   
