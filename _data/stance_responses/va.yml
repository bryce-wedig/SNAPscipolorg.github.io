    Healthcare should be affordable and accessible without forcing Americans into financial hardship. I believe we need more competition, greater price transparency, and fewer unnecessary regulations that drive up healthcare costs.

    I would support expanding access to independent clinics, allowing patients to compare prices before receiving treatment, and reducing administrative burdens that increase costs without improving care. We should also encourage competition in prescription drug pricing.

    For our veterans, I have proposed the Veterans 28 Act, requiring timely VA appointments and access to community care when the VA cannot provide treatment within established deadlines.

    I also believe Congress must prioritize healthcare needs here at home, eliminate wasteful spending, and ensure that essential services reach the people who need them.

    My goal is a healthcare system where patients have more choices, providers face fewer unnecessary barriers, and families can afford the care they need.   

