    I would not treat headcount as a goal. I would fund positions that do real work with measurable results, and I would cut positions that exist to expand process, political programming, or agency self-protection.

    My approach:

    - Start with the mission, not the org chart. Fund scientists, engineers, lab staff, and program officers who produce research or protect the public. Do not automatically refill every administrative, communications, or “equity” slot that grew after 2020.
    - Demand transparency. Congress should know how many civilians are in each function, what they cost, and what they delivered. If an office cannot show that, it should shrink.
    - Separate essential public-health capacity from the mandate-and-messaging apparatus. I support competent disease surveillance and emergency response. I do not support using civilian payroll to enforce one-size-fits-all medical policy or to police speech.
    - Apply the same standard to NSF, NIH, CDC, and similar agencies. Overhead and grant administration have grown faster than results. Cut that first before touching bench science.
    - Do not hide behind “local jobs.” NSF is in this district. Those are neighbors. That does not make every GS slot permanent. Protect productive work; do not protect bureaucracy because the building is in Alexandria.
    - Stop using federal hiring as a social program. Hire for competence. Alternative talent from industry and the military should be welcome. Loyalty tests and ideological screens should not be.

    I took an oath to the Constitution, not to any agency’s workforce target. Appropriations should pay for a smaller, more accountable civil service that serves taxpayers—not a permanent class that serves itself.

