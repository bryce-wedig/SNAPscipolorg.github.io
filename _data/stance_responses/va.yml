    Healthcare is too expensive because government, insurers, and hospital systems have turned it into a captured industry. I lived that as a mom, a Navy veteran, and someone pulled through the behavioral-health system after a bad reaction to a prescription. Mandates, bureaucracy, and taxpayer-funded care for people who should not be here all push costs onto working Virginians.

    If elected I would not vote to expand the Affordable Care Act or pour more open-ended subsidies into the same insurance model. I would:

    - Restore medical freedom. No federal vaccine or treatment mandates. Informed consent belongs with patients and parents.
    - Stop using Medicaid as a magnet. Citizen and legal-resident families come first.
    - Cut the rules that inflate prices—certificate-of-need barriers, billing games, and red tape that protect incumbents.
    - Require real price transparency so families can comparison-shop.
    - Put more focus on prevention, nutrition, and chronic-disease reduction instead of a sick-care model that profits from lifelong prescriptions.
    - Hold agencies and hospital systems accountable when they waste money or push one-size-fits-all protocols.

    Affordability will not come from writing bigger checks to the same system. It will come from shrinking the parts of government that make care more expensive and putting families ahead of special interests.

