   Yes. Rural communities, veterans, expectant mothers, and people with disabilities often face additional barriers to healthcare. I support targeted solutions that address these challenges without creating unnecessary bureaucracy.

    For rural communities, I would encourage independent clinics, telehealth services, and incentives for healthcare professionals to practice in underserved areas. I also support improving access to prenatal and maternity care, particularly where hospitals have reduced services.

    My proposed Veterans 28 Act would require VA appointments within 28 days, or 20 days for mental healthcare, with timely access to community care when those deadlines cannot be met.

    For people with disabilities, I support strengthening access to home- and community-based services, reducing caregiver shortages, and protecting individual choice.

    Healthcare policies should recognize that different communities have different needs while ensuring every American has a fair opportunity to receive timely, affordable care.
   
