    As a Libertarian, I believe federal funding should focus on essential public responsibilities while encouraging efficiency, accountability, and greater private-sector participation.

    I would support maintaining qualified federal civilian professionals in critical areas such as public health, disease prevention, scientific research, and national preparedness. However, funding decisions should be based on demonstrated needs and measurable results rather than automatically expanding federal agencies.

    I would also encourage public-private partnerships, targeted tax incentives, and collaboration with universities and independent research institutions to gradually reduce dependence on federal spending without disrupting essential services.

    My goal is not to eliminate valuable federal positions, but to reduce unnecessary bureaucracy, avoid duplication, and ensure taxpayer dollars directly support meaningful scientific and public health outcomes.

    We need an effective federal workforce, not necessarily a larger one.
   
