- candidate_first_name: Dave
  candidate_last_name: Dawson
  state: ia
  race: US House of Representatives
  party: Democratic
  question: ia-q1
  date: 2026-09-27
  primary_candidate: false
  response: |
    In March 2026, the Harkin Institute and the Iowa Environmental Council released a report that says what too many politicians will not: the nitrate, pesticides, PFAS, and radon Iowans are exposed to every day are linked to the cancers rising fastest in our state. I support the recommendations in that report, and Congress has a direct responsibility to act on them.

    That starts with enforcing the laws already on the books. In Congress, I will fight to make the EPA enforce the Safe Drinking Water Act's nitrate standard here in Iowa, where 80 percent of the nitrate in our rivers comes from agricultural runoff. I will push for a hard federal review of acetochlor and atrazine, chemicals banned in the European Union but used more heavily in Iowa than in any other state, and for enforceable limits on PFAS, which have been found in 94 percent of Iowa's surface waters. I will fight for full funding of water quality monitoring so Iowans actually know what is coming out of the tap, and I will oppose every attempt to shield chemical companies from liability when their products make people sick. Our farmers drink the same water our families do. Protecting it is not anti-agriculture. It is how we keep Iowans alive.

