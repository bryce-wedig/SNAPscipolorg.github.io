    Connecticut families and businesses pay among the highest electric rates in the country because our energy system is built to serve utility shareholders. Eversource and UI operate as monopolies guaranteed a profit on every dollar they spend, and ratepayers carry the cost.

    I am the only candidate in this race calling for structural change. State law, CGS §16-10a, allows Connecticut to revoke utility franchises for failure to serve the public interest. I would use that authority to move toward public ownership of our distribution system, so decisions about the grid answer to ratepayers.

    On diversification, Connecticut should build out every clean resource available to us: offshore wind, solar paired with storage, and continued operation of Millstone, which already supplies the largest share of our carbon-free power. Expanded storage and grid modernization reduce our dependence on natural gas peaker plants, which set the price of electricity in New England and drive rate spikes.

    I would also expand energy efficiency and weatherization programs, the cheapest kilowatt being the one we never use, and pursue deeper regional coordination on transmission so New England states stop bidding against each other.

    Lower bills come from changing who the system works for.

