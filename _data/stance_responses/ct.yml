    Federal cuts to NIH and NSF funding are an attack on Connecticut's economy and its future. Research at UConn, Yale, and our other institutions drives discovery, trains our workforce, and anchors thousands of jobs in bioscience, engineering, and medicine. When Washington pulls back, the state has an obligation to act.

    This moment is also an opportunity. As the federal government and other states pull away from research, now is the time to make deep investments and become a beacon for the science community. Connecticut can brand itself the science state.

    As chair of the Higher Education Committee, I fought for public investment in our universities and against the disinvestment that pushes costs onto students. As governor, I would build on that record: a state bridge fund to sustain research programs and retain scientists when federal grants are cut or frozen, expanded state matching for research that serves Connecticut's needs in public health, clean energy, and advanced manufacturing, and stronger pipelines connecting our universities to Connecticut employers so the talent we train stays here.

    Oversight should mean stewardship of public dollars. State investment will never come with ideological screening of grants, banned topics, or censored findings, the political strings Washington now attaches to research funding.

    The outcome is straightforward: Connecticut becomes the state where researchers come when Washington abandons science, and the discoveries made here translate into jobs, cures, and lower costs for our residents.

