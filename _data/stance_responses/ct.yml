    There’s no sugarcoating it: energy costs in Connecticut are too high, and it impacts our families and our economic competitiveness. My strategy focuses on two pillars: strict utility accountability and aggressive source diversification.

    First, we are holding utilities like Eversource and UI accountable. I recently introduced a proposal that would add an affordability standard for utilities, have to deliver on service to renew their franchises, and have them implement cost-reduction technologies. 

    Second, we must reduce our dependence on fossil fuels. We’ve secured the future of the Millstone Nuclear Power Station, and we are aggressively expanding into offshore wind and solar. By scaling up regional clean energy procurement and upgrading our grid infrastructure, we will stabilize long-term costs, reduce our reliance on volatile fossil fuels, and achieve our mandate of a 100% zero-carbon electricity supply. Clean energy isn’t just an environmental necessity; it’s an economic one.

