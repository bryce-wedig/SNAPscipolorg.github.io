    I favor a moratorium on AI until its effects on the human brain, the environment, energy and water consumption, data privacy, human health, and impact on the workforce can be thoroughly studied. New technologies that have the potential to fundamentally change humanity should be pursued but not until we have a better understanding the risks and measuring them against the possible benefits. Once we have been able to study the effects of the above variables and determine that this technology can be safely used, I would favor moving forward cautiously with implementing AI into society and the economy if there are strict regulations in place. These regulations should include environmental protections, workplace protections, restrictions on data usage to prevent the furtherance of a surveillance state, and a focus on using the technology to improve work conditions through reduced hours with no loss in pay. AI must never be used to replace workers with possible exceptions for high risk positions where AI could mitigate harm to human life. There needs to be strict limit on where construction of AI data centers may occur to prevent harm to residential neighborhoods and protected habitats. 

