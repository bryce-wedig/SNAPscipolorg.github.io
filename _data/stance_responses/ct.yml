    We need to recommit to the World Health Organization (WHO) to ensure global efforts continue to monitor for re-emerging or novel viruses and other infectious disease. There needs to be reforms made to WHO with increased oversight. The heavy top-down bureaucracy needs to be reorganized to allow for better rapid on the ground decision making during localized crises while streamlining communications to better respond to health emergencies.  Protections need to be put in place to limit political influence liability from more powerful member states. The CDC cuts are also impacting public health. Staffing and funding need to be returned to 2024 levels with reforms. Trust in our public health systems have eroded, and care must be taken to restore that trust. Accountable learning for emerging novel diseases should be implemented, while also providing protections to ensure communication is free from political or corporate pressures and biases. People need to have the information but more importantly, must trust the information being given. The public also needs to be educated more on the realities of how policy develops especially during dynamic and rapidly evolving situations involving novel disease.  The public must have guarantees of transparency especially after unavoidable erroneous guidance is issued.   

