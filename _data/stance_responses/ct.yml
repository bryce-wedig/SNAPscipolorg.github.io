    Protecting Connecticut’s environment means safeguarding both our natural beauty and the health of our residents. Clean air and clean water are fundamental rights, and our policies ensure a healthier, more sustainable Connecticut for generations to come.

    First, we know climate change is already here, so we have to invest in resilience, particularly for our vulnerable coastal communities facing rising sea levels and intense storms. We are using federal funding when possible, but we know many communities cannot wait for a new administration. We need to be ready to fill those gaps at the state level. 

    We are also aggressively tackling legacy industrial pollution. Through our Department of Energy and Environmental Protection (DEEP), we have streamlined brownfield remediation, turning contaminated urban sites into vibrant, economic spaces.  Transportation is a major driver in carbon emissions, we are making historic investments in public transit and electrification. 

