    Science is the foundation for which societies advance and improve the human condition. We need to increase the NIH Budget by 25% above its real (versus nominal) high in 2003 currently equating to $62.5 billion indexed to inflation to ensure scientific purchasing power remains constant. The same should be done for the NSF budget which would equate to a new budget of $15.5 billion. These research dollars continuously produce 150%-300% returns on economic activity through investments, jobs, and local spending on other economic sectors. To ensure trust in science, we must move away from a profit driven system and focus on a people driven model such that medicine prioritizes prevention and cures over treatment, with treatment still being an integral part of research. To further increase trust, we should restructure the Peer Review process and grant process to increase transparency and ensure equal access to all publicly funded data. We should impose fees on private industry using federally funded university research data to ensure these companies are paying into the system they are benefitting from. Lastly, federal dollars for research should only be used within the domestic United States with the exception of travel or similar necessities for collaborative efforts. 

