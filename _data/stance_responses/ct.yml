  response: |
    AI is arriving the way every major technology has: with enormous potential and with the costs falling on working families unless government sets the rules. Connecticut should shape this transition instead of reacting to it.

    Workforce comes first. Workers deserve a say in how AI is deployed in their workplaces, protection from algorithmic surveillance and automated firing, and deep investment in retraining as jobs change. When AI displaces workers, the productivity gains should flow to the people affected, through wages, hours, and transition support.

    On privacy, Connecticut already has data privacy laws. I would strengthen it: limits on how companies collect and use personal data to train AI systems, transparency requirements when AI makes decisions about housing, credit, hiring, or insurance, and a right to human review of those decisions.

    Equity of access means every district's students learn to use these tools, and broadband reaches every home, so AI widens opportunity instead of concentrating it.

    The competitiveness case runs through our universities. The research investments I described earlier apply here directly: Connecticut can be a hub for AI research and the jobs that come with it, on terms that serve the public.
