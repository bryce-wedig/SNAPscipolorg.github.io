  response: |
    I do not support the expansion of large data centers in Florida. I do not believe these projects are in the best interest of our communities, and I am opposed to approving them in our state. Instead of pursuing more large scale data center development, we should focus on protecting our existing residents, small businesses, and infrastructure from added strain.
    I oppose
    
    Any increase in utility costs or resource demand placed on homeowners and small businesses due to data center development.
    The approval of large data centers without full and transparent disclosure of their environmental and infrastructure impacts.
    The use of significant water and energy resources for projects that do not directly benefit local communities.
    Prioritizing corporate development over the needs and voices of Florida residents.
    Moving forward with major projects without strong, binding protections for local communities.
    
    My position is clear: Florida should not sacrifice its resources, infrastructure, or quality of life for large data center projects. Our priority must always be the people who already live and work here.

    Keywords: Florida residents, Priority, Infrastructure




