    Cancer has touched far too many Florida families. I believe the best way to fight cancer is to prevent it whenever possible. 
    
    As your State Representative, I will support: Expanding access to cancer screenings and early detection, especially in underserved communities. Increasing education about the dangers of tobacco, excessive alcohol use, and unnecessary UV exposure. Supporting voluntary vaccination programs and giving families accurate information so they can make informed healthcare decisions. Working to reduce environmental risks, including radon exposure where appropriate, and promoting healthier homes and communities. Partnering with schools, nonprofits, healthcare providers, and local businesses to promote healthy lifestyles and prevention. 
    
