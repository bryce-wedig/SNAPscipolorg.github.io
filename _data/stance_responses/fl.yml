    I believe good public policy should be based on facts, transparency, and accountability. As a legislator, I will seek information from multiple credible sources, including scientists, medical professionals, engineers, economists, business leaders, and the people who will be directly affected by the policy. I also believe it is important to review data, consider differing viewpoints, ask thoughtful questions, and evaluate both the scientific evidence and the real-world economic and social impacts before making a decision.

    Science plays an important role in informing policy, but policymakers must also consider constitutional principles, individual rights, fiscal responsibility, and the practical consequences of legislation. My goal is to make decisions based on reliable evidence while ensuring that policies serve the best interests of Florida's families, businesses, and communities.

    One example is Florida's increasing vulnerability to hurricanes and flooding. Scientific research, engineering studies, and historical storm data demonstrate the need for stronger infrastructure, improved stormwater systems, and better disaster preparedness. Those findings reinforce my support for investing in resilient infrastructure that protects lives, reduces long-term costs, and strengthens our economy while being responsible with taxpayer dollars.

    As your State Representative, I will always remain open to new evidence, listen respectfully to experts and constituents, and make decisions that are informed, balanced, and focused on achieving the best outcomes for District 108 and the State of Florida.

    Keywords: Evidence-based policy Common-sense solutions Fiscal responsibility Transparency Government accountability Individual freedom Constitutional government Public safety Innovation Private-sector expertise Local input Practical results Cost-effective solutions Responsible stewardship Balanced decision-making

