  response: |
    Artificial intelligence and data centers are becoming an important part of Florida's economy. They can attract investment, create high-paying jobs, strengthen our technology sector, and improve our state's competitiveness. I support policies that encourage responsible economic development and innovation.

    At the same time, economic growth should not come at the expense of local communities. Data centers consume significant amounts of electricity and water, and their development should include responsible planning, environmental stewardship, and transparency. I believe Florida has made progress by establishing additional protections for nearby residents and small businesses, but we should continue evaluating whether those protections remain effective as technology and energy demands evolve.

    As your State Representative, I would support policies that:

    Require meaningful coordination with local governments and affected communities before large data center projects are approved.
    Encourage energy-efficient and water-efficient technologies to reduce environmental impacts.
    Promote investments in electric grid and water infrastructure so existing residents and businesses are not negatively affected.
    Support workforce development through partnerships with colleges, technical schools, and the private sector to prepare Floridians for careers in artificial intelligence, cybersecurity, cloud computing, and information technology.
    Ensure tax incentives provide a measurable return on investment through job creation, economic development, and long-term benefits for Florida taxpayers.

    My goal is to make Florida a national leader in technology and innovation while protecting our communities, natural resources, and quality of life. We can achieve both economic growth and responsible stewardship through smart, balanced policymaking.

    Keywords: Free-market innovation Private-sector investment Economic growth Technology leadership Limited government Government accountability Fiscal responsibility Return on investment Infrastructure modernization Energy reliability Local control Public-private partnerships Workforce development Responsible regulation Smart growth









