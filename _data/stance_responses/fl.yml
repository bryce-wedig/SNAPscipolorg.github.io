    I believe Florida should be a state where everyone has the opportunity to live, work, and raise a family safely and affordably. Protecting our communities from hurricanes, flooding, extreme heat, and other natural hazards requires practical solutions, not politics.

    As your State Representative, I will support strengthening Florida's infrastructure by investing in stormwater drainage systems, flood mitigation projects, and resilient roads and bridges that can better withstand severe weather. I also support protecting our coastlines, waterways, and natural resources because they are essential to our economy, tourism, and quality of life.

    I believe we must address the homeowners' insurance crisis by increasing accountability in the insurance market, encouraging competition, combating fraud, and pursuing policies that help stabilize premiums for homeowners.

    I also support working with local governments, emergency management officials, and the private sector to improve disaster preparedness, modernize building standards where appropriate, and ensure our communities recover quickly after storms. My goal is to protect Florida families, strengthen our economy, and make our state more resilient while being responsible with taxpayer dollars.

    Keywords: Lower homeowners' insurance costs. Better hurricane and flood preparedness. Improved drainage and flood-control infrastructure. Protection of Biscayne Bay and local waterways. Responsible stewardship of Florida's environment. Strong emergency response and disaster recovery. Smart infrastructure investments that protect both residents and businesses.
    
