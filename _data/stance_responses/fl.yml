    As your State Representative, I would support expanding public education campaigns on tobacco cessation, healthy lifestyles, sun safety, and environmental health risks such as radon exposure. I also support increasing access to cancer screenings and preventive healthcare services, particularly in underserved communities, because early detection saves lives and reduces long-term healthcare costs.

