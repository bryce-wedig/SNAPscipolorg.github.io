- candidate_first_name: Dan
  candidate_last_name: Ahlers
  state: sd
  race: Governor
  district: 
  party: Democratic
  question: sd-q1
  date:
  response: |
    "Trust is built through relationships, not press releases. As governor, I’d make sure scientists and policymakers aren’t strangers who only meet during a crisis.
    
    First, I’d bring researchers into the room early. South Dakota has real scientific strengths that punch well above our weight; SDSU’s agricultural research, USD’s biomedical work, the School of Mines, and SURF in Lead. Those experts should be advising on water quality, agriculture, public health, and energy before decisions are made.
    
    Second, scientists and public officials both need to explain their work in plain language and show how it connects to people’s lives, like a better crop yield, a cleaner aquifer, or a new treatment at a hospital in Sioux Falls or Rapid City. When people see the value, support follows. 
    
    Third, we have to be honest about uncertainty. Science evolves, and admitting what we don’t yet know builds credibility. Finally, I’d fight for stable research funding, including pressing our congressional delegation to protect the federal investment our universities and producers depend on. Science shouldn’t be partisan. I firmly believe it’s how we solve problems. "

    KEYWORDS: Research, Better Leadership, Credibility

