  question: sd-q2
  date:
  response: |
    "South Dakota stands alone amongst other similar states in our use of renewable energy. And I believe that success is a farm and ranch story. Wind turbines, ethanol plants, and our Missouri River’s hydropower put money into our landowners’ pockets, support rural tax bases, and keep energy dollars in-state, and I wish to build on that. I’d support a predictable permitting process that gives developers certainty while respecting local input and bastioning landowner rights, because no one’s land should be taken for a private project without their consent. We need transmission investment so the power we generate can reach markets instead of sitting stranded. I’d expand our scope of biofuels and value-added agriculture, including higher ethanol blends and sustainable aviation fuel, so our corn and soybeans earn more.
    
    I’d also strengthen research partnerships with our universities and schools like SDSU, USD, and the School of Mines on energy storage, grid reliability, and next-generation fuels, as well as invest in workforce training through our tech schools for the jobs these projects create. I’d also keep an all-of-the-above approach, because reliability and affordability matter to every family, especially in a South Dakota winter. Energy development done right means lower bills, stronger rural communities, and young people who can build a career here without leaving the state."

    KEYWORDS: Biofuels, landowner rights, infrastructure
    
