       Data centers represent a significant economic and technological opportunity for Mississippi and the United States, but development on this scale also carries responsibilities that should not be ignored. These facilities can attract billions of dollars in private investment, support construction and technology jobs, expand infrastructure, strengthen America’s digital economy, and position Mississippi to participate in industries that will shape the future. I welcome those opportunities. At the same time, communities deserve clear answers about electricity demand, water consumption, environmental effects, infrastructure requirements, utility rates, permanent job creation, and who ultimately pays for the additional capacity these facilities require. My position is not anti-technology or anti-development. It is pro-responsibility. Mississippi families should not be expected to subsidize enormous corporate developments through higher utility bills, strained water resources, or infrastructure costs shifted onto local taxpayers. I support transparent environmental and infrastructure assessments, responsible water management, thoughtful grid planning, appropriate community involvement, and utility structures that ensure major industrial users bear a fair share of the costs created by their operations. I want Mississippi to compete for the industries of tomorrow. But economic development should improve the quality of life of the people who already call Mississippi home. Innovation and human wellbeing should advance together.

