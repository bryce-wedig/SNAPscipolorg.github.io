       Yes. I believe elected officials have a responsibility to engage scientific expertise while also respecting the public’s right to ask questions. Trust cannot be demanded. It must be earned. Good science depends on evidence, transparency, testing, scrutiny, and a willingness to revise conclusions when better evidence becomes available. Good government should demonstrate those same qualities. As a member of Congress, I would seek input from scientists, physicians, engineers, researchers, educators, farmers, fishermen, industry professionals, and community stakeholders when considering policies involving science and technology. I also believe we need stronger communication between scientific institutions and the communities affected by scientific and technological decisions. Scientists should have opportunities to explain not only what the evidence shows, but also what remains uncertain. Likewise, elected officials should be willing to explain how scientific evidence influenced their decisions. I will never treat legitimate questions from the public as an inconvenience. Listening is part of leadership. When government is transparent, scientists communicate clearly, and citizens are respected enough to be included in the conversation, we create the conditions necessary for trust to grow.

