       Absolutely. If Mississippi wants to become a leader in science, technology, healthcare, advanced manufacturing, energy, aerospace, cybersecurity, and other emerging industries, that work must begin long before a student enters a four-year university. I support expanding high-quality STEM education in K–12 schools, strengthening science laboratories and classroom technology, investing in science and mathematics teachers, expanding career and technical education, and creating more opportunities for students to participate in hands-on research. Community colleges are particularly important. They provide an affordable pathway into skilled professions and can respond quickly to the workforce needs of local industries. I support stronger partnerships among community colleges, universities, employers, military installations, healthcare systems, manufacturers, research institutions, and federal agencies. I also want rural students to have access to the same quality of STEM opportunities available in larger communities. A child’s ZIP code should not determine whether that child has access to a laboratory, advanced mathematics, engineering, coding, or a pathway into a scientific career. Mississippi already has talented young people. Our responsibility is to make sure opportunity reaches them.

