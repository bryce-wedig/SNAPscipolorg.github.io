       I believe protecting our agriculture, fisheries, and wildlife is both an economic responsibility and a commitment to future generations. In Mississippi, these resources are part of who we are. Farmers, fishermen, shrimpers, foresters, processors, small businesses, and coastal communities depend on healthy land and water for their livelihoods. Our policies should recognize that conservation and economic prosperity do not have to compete. I support a strong agricultural safety net, crop insurance, disaster assistance, agricultural research, access to affordable credit, and voluntary conservation programs that help producers improve soil health, reduce erosion, protect water quality, and preserve wildlife habitat. I also support sustained investment in fisheries science, coastal and wetland restoration, responsible fisheries management, and efforts to protect the long-term health of the Gulf of Mexico. I believe the people who work our farms, forests, rivers, and coastal waters should have a meaningful voice in the policies affecting them. Good conservation policy should be grounded in science, informed by local experience, and designed to preserve both our natural resources and the livelihoods that depend upon them. Our responsibility is to leave the next generation productive farmland, healthy fisheries, abundant wildlife, clean water, and an economy capable of sustaining the families who care for these resources.

