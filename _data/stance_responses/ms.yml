       Artificial intelligence has extraordinary potential to improve medicine, scientific research, agriculture, education, national defense, manufacturing, accessibility, and economic productivity. America should remain a global leader in its responsible development. But technological capability should never become an excuse to abandon human responsibility. I support a risk-based approach to AI regulation that distinguishes between ordinary, low-risk applications and systems capable of significantly affecting a person’s health, employment, finances, education, privacy, civil rights, or access to government services. When AI is used to make consequential decisions about people’s lives, I believe transparency and accountability are essential. Individuals should know when automated systems materially influence important decisions about them, and meaningful human review should remain available where appropriate. I also support strong protections against AI-enabled fraud, malicious impersonation, cybercrime, exploitation, discriminatory outcomes, and other foreseeable harms. Developers of high-risk systems should take reasonable steps to evaluate security, accuracy, bias, and safety before those systems are widely deployed. At the same time, regulation should be carefully designed so that responsible researchers, entrepreneurs, universities, and small businesses are not prevented from innovating. I do not believe we must choose between technological leadership and protecting people. America should lead the world in artificial intelligence, and we should also lead the world in developing it responsibly.

