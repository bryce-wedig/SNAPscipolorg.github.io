name: Links

on:
  pull_request:
  push:
    branches:
      - source
      - feature/lychee-link-checker  # for testing the workflow
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write # required for peter-evans/create-issue-from-file
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir '${{ github.workspace }}'
            --accept '200..=299,401,403'
            --max-retries 5
            --retry-wait-time 2
            --max-concurrency 1
            './_posts/**/*.md'
            './_pages/**/*.md'
            './_pages/**/*.html'
            './_initiatives/**/*.html'
          # Fail the job on PRs so the check blocks merge;
          # stay non-failing elsewhere so the issue-filing path runs.
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Find existing report issue
        id: last-issue
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: micalevisk/last-issue-action@v2
        with:
          state: open
          labels: lychee

      - name: Create/Update Issue From File
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.last-issue.outputs.issue-number }}
          labels: lychee, report, automated issue
